name: Deploy to GitHub Pages

on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI, JS / GUI]
    types: [completed]
    branches: [master]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check-tests:
    name: Verify CI tests passed
    runs-on: ubuntu-latest
    outputs:
      should-build: ${{ steps.check.outputs.should-build }}
    steps:
      - name: Check all required workflows passed
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sha="${{ github.event.workflow_run.head_sha }}"
          repo="${{ github.repository }}"
          for wf in "CI" "JS / GUI"; do
            echo "Checking $wf for $sha..."
            conclusion=$(gh api "repos/$repo/actions/runs?event=push&branch=master&per_page=20" --jq "[.workflow_runs[] | select(.name==\"$wf\" and .head_sha==\"$sha\" and .status==\"completed\")] | sort_by(.run_number) | reverse | .[0].conclusion // empty")
            if [ "$conclusion" != "success" ]; then
              echo "$wf not yet passed for $sha (conclusion=$conclusion)"
              echo "should-build=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "All required workflows passed."
          echo "should-build=true" >> "$GITHUB_OUTPUT"

  build:
    name: Build wasm + site
    needs: check-tests
    if: needs.check-tests.outputs.should-build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: stable-cache

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      - name: Build wasm package
        run: wasm-pack build --target web --release --out-dir site/pkg -- --no-default-features --features wasm

      - name: Copy demo into site
        run: |
          cp demo/index.html site/index.html
          cp demo/shared/favicon.ico site/favicon.ico
          mkdir -p site/shared
          cp demo/shared/favicon.ico site/shared/favicon.ico
          cp demo/shared/page.css site/shared/
          mkdir -p site/git
          cp demo/git/index.html site/git/index.html
          cp demo/git/blame.html site/git/blame.html
          cp demo/nip-pip-example.html site/nip-pip-example.html
          cp demo/network_time.html site/network_time.html
          cp demo/chat.html site/chat.html
          mkdir -p site/dag
          cp demo/dag/index.html site/dag/index.html
          # Keep this in sync with Makefile/.justfile so /dag/ keeps its action module after site rebuilds.
          cp demo/dag/*.mjs site/dag/
          mkdir -p site/bridge
          cp demo/bridge/*.html site/bridge/
          mkdir -p site/shared
          cp demo/shared/*.js demo/shared/*.mjs site/shared/
          mkdir -p site/vendor
          cp demo/vendor/* site/vendor/
          cp demo/.nojekyll site/.nojekyll
          mkdir -p site/.well-known
          cp demo/.well-known/nostr.json site/.well-known/nostr.json
          mkdir -p site/examples
          cp examples/*.html site/examples/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
