name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  test:
    name: Test (native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build (native)
        run: cargo build --features native

      - name: Run tests
        run: cargo test --features native

  js:
    name: Test (JS / GUI)
    needs: wasm
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'workflow_dispatch' && fromJSON('["ubuntu-latest","windows-latest","macos-latest"]') || fromJSON('["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Node dependencies
        run: npm ci

      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Generate build version module
        run: cargo check --quiet

      - name: Check for uncommitted generated files
        run: git diff --exit-code || (echo "::error::Uncommitted changes detected after build. Run cargo check locally and commit generated files." && exit 1)

      - name: Download wasm artifact
        uses: actions/download-artifact@v4
        with:
          name: wasm-pkg
          path: site/pkg

      - name: Run JS tests
        run: node --test test/*.test.mjs

  wasm:
    name: Build (wasm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add wasm32-unknown-unknown

      - name: Install clang for wasm C dependencies
        run: sudo apt-get update && sudo apt-get install -y clang lld

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('**/Cargo.lock') }}

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      - name: Build wasm package
        run: wasm-pack build --target web --out-dir site/pkg --no-default-features --features wasm

      - name: Test wasm JS contracts
        run: node --test test/git-wasm.test.mjs test/p2p-wasm.test.mjs

      - name: Copy shared CSS for site assets
        run: |
          mkdir -p site/shared
          cp demo/shared/page.css site/shared/

      - name: Upload wasm artifact
        uses: actions/upload-artifact@v4
        with:
          name: wasm-pkg
          path: site/pkg/

  p2p:
    name: Build (p2p native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install libp2p system deps
        run: sudo apt-get install -y libssl-dev pkg-config

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-p2p-${{ hashFiles('**/Cargo.lock') }}

      - name: Build (native + p2p)
        run: cargo build --features native,p2p

      - name: Test (native + p2p)
        run: cargo test --features native,p2p

  p2p-wasm:
    name: Build (p2p-wasm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-p2p-wasm-${{ hashFiles('**/Cargo.lock') }}

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      - name: Build wasm package (p2p-wasm)
        env:
          CC: clang
          CXX: clang++
        run: wasm-pack build --target web --no-default-features --features wasm,p2p-wasm
