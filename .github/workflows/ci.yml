name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      run_native:
        description: 'Run native Rust tests'
        type: boolean
        default: true
      run_p2p:
        description: 'Build and test p2p native'
        type: boolean
        default: true
      run_p2p_wasm:
        description: 'Build p2p-wasm'
        type: boolean
        default: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  test:
    name: Test (native)
    if: github.event_name != 'workflow_dispatch' || inputs.run_native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: stable-cache

      - name: Build (native)
        run: cargo build --features native

      - name: Run tests
        run: cargo test --features native

  p2p:
    name: Build (p2p native)
    if: github.event_name != 'workflow_dispatch' || inputs.run_p2p
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install libp2p system deps
        run: sudo apt-get install -y libssl-dev pkg-config

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: stable-cache

      - name: Build (native + p2p)
        run: cargo build --features native,p2p

      - name: Test (native + p2p)
        run: cargo test --features native,p2p

  p2p-wasm:
    name: Build (p2p-wasm)
    if: github.event_name != 'workflow_dispatch' || inputs.run_p2p_wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: stable-cache

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      - name: Build wasm package (p2p-wasm)
        env:
          CC: clang
          CXX: clang++
        run: wasm-pack build --target web --no-default-features --features wasm,p2p-wasm
