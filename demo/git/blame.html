<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' blob: 'wasm-unsafe-eval' https://cdn.jsdelivr.net https://esm.sh; worker-src 'self' blob: 'wasm-unsafe-eval' https://cdn.jsdelivr.net https://esm.sh; style-src 'self' 'unsafe-inline'; connect-src *; img-src 'self' data: https:; font-src 'self';" />
  <link rel="icon" href="../shared/favicon.ico" />
  <link rel="stylesheet" href="../shared/page.css" />
  <title>nostr-dag Blame View</title>
  
</head>
<body>
  <header id="sharedHeader"></header>
  <main class="page-content">
    <div class="panel">
      <div class="row" style="justify-content:space-between; align-items:center;">
        <div class="row">
          <span id="status" class="status status-idle" title="Starting..."><span class="status-dot"></span></span>
        </div>
        <a class="button" id="backToIndex" href="./">Back to repo view</a>
      </div>
    </div>
    <div id="view"></div>
  </main>
  <footer id="pageFooter"></footer>

  <script type="module">
    import { scheduleAfterPaint } from '../shared/async-lifecycle.mjs';
    import { remoteTagNames } from '../shared/git-refs.mjs';
    import { createGitProgressReporter } from '../shared/git-progress.mjs';
    import { cloneWithSingleBranchFallback } from '../shared/git-clone.mjs';
    import { bootstrapGitChrome, GIT_REPOS, isSafariMobile, probeRemoteHost } from '../shared/git-page.mjs';
    import {
      buildSelectOptions,
      createCommitSummary,
      defaultRefForRefs,
      ensureDir,
      escapeHtml,
      getRouteContext,
      pathExists,
      repoBrowseAtCommitHref,
      repoCommitHref,
      repoCommitsHref,
      repoFileHref,
      repoSelectionHref,
      resolveRefSelection,
    } from '../shared/git-viewer.mjs';
    import git from 'https://cdn.jsdelivr.net/npm/isomorphic-git@1.25.0/+esm';
    import http from 'https://cdn.jsdelivr.net/npm/isomorphic-git@1.25.0/http/web/+esm';
    import LightningFS from 'https://cdn.jsdelivr.net/npm/@isomorphic-git/lightning-fs@4.6.0/+esm';

    const fs = new LightningFS('git-viewer');
    const { footer, networkTime } = bootstrapGitChrome({
      headerRoot: document.getElementById('sharedHeader'),
      footerRoot: document.getElementById('pageFooter'),
    });
    footer.setLevel('info');
    const statusEl = document.getElementById('status');
    const viewEl = document.getElementById('view');
    const repos = GIT_REPOS;

    async function initGitP2P() {
      try {
        if (isSafariMobile()) {
          footer.log('libp2p', 'skipping libp2p bootstrap on Safari mobile', 'info', 'idle');
          return;
        }
        const { createSharedLibp2pStack } = await import('../shared/libp2p-stack.mjs');
        const { node } = await createSharedLibp2pStack({
          onLog(level, text, state) {
            footer.log('libp2p', text, level, state);
          },
          onPeer({ kind, peer, detail }) {
            footer.log('libp2p', `${kind}: ${peer}`, 'debug', kind === 'connected' ? 'available' : 'checking');
            footer.log('libp2p', `${kind} detail: ${detail ? JSON.stringify(detail) : 'none'}`, 'trace', kind === 'connected' ? 'available' : 'checking');
          },
        });
        window.__gitBlameP2pNode = node;
        networkTime.attachNode(node);
        footer.log('libp2p', `node ready: ${node.peerId.toString()}`, 'info', 'available');
      } catch (e) {
        footer.log('libp2p', `bootstrap failed: ${e.message}`, 'error', 'unavailable');
      }
    }
    // Delay libp2p bootstrap until after first paint to prevent cold-start
    // regressions from blocking the blame UI and shared header render.
    scheduleAfterPaint(() => {
      void initGitP2P();
    });

    function setStatus(text, state = 'idle') { statusEl.className = `status status-${state}`; statusEl.title = text; const level = state === 'unavailable' ? 'error' : state === 'checking' ? 'debug' : 'info'; footer.log('git', text, level, state); }
    function repoCodeHref(repo, route = {}) { return route.commit ? repoBrowseAtCommitHref(repo, route) : repoSelectionHref(repo, route); }
    function repoBlameHref(repo, route = {}, commit = null) { return repoFileHref(repo, { ...route, commit }); }
    function progressContextLabel(route) { if (route?.branch) return `branch ${route.branch}`; if (route?.tag) return `tag ${route.tag}`; return ''; }
    const reporters = new Map();
    function getGitProgressReporter(repo, operation, route) { const context = progressContextLabel(route); const key = `${repo.name}:${operation}:${context}`; if (!reporters.has(key)) reporters.set(key, createGitProgressReporter(repo.name, operation, context)); return reporters.get(key); }
    function splitLines(text) { return String(text || '').replace(/\r\n/g, '\n').split('\n'); }
    function diffLineAssignments(beforeLines, afterLines, beforeAssignments, currentCommit) { const rows = Array.from({ length: beforeLines.length + 1 }, () => Array(afterLines.length + 1).fill(0)); for (let i = beforeLines.length - 1; i >= 0; i -= 1) { for (let j = afterLines.length - 1; j >= 0; j -= 1) { rows[i][j] = beforeLines[i] === afterLines[j] ? rows[i + 1][j + 1] + 1 : Math.max(rows[i + 1][j], rows[i][j + 1]); } } const nextAssignments = []; let i = 0; let j = 0; while (i < beforeLines.length && j < afterLines.length) { if (beforeLines[i] === afterLines[j]) { nextAssignments.push(beforeAssignments[i]); i += 1; j += 1; } else if (rows[i + 1][j] >= rows[i][j + 1]) { i += 1; } else { nextAssignments.push(currentCommit); j += 1; } } while (j < afterLines.length) { nextAssignments.push(currentCommit); j += 1; } return nextAssignments; }
    function decodeBlob(bytes) { return bytes ? new TextDecoder('utf-8').decode(bytes) : ''; }
    function isBinaryBytes(bytes) { return bytes && Array.from(bytes).includes(0); }
    async function buildFileBlame(repo, ref, filepath) {
      if (!ref || !filepath) return null;
      const history = await git.log({ fs, dir: repo.dir, ref, filepath, depth: 40 }).catch(() => []);
      if (!history.length) return { path: filepath, ref, lines: [], missing: true };
      const versions = [];
      for (const entry of [...history].reverse()) {
        const blob = await git.readBlob({ fs, dir: repo.dir, oid: entry.oid, filepath }).catch(() => null);
        if (!blob?.blob) continue;
        if (isBinaryBytes(blob.blob)) return { path: filepath, ref, binary: true, lines: [] };
        versions.push({ commit: createCommitSummary(entry), text: decodeBlob(blob.blob) });
      }
      if (!versions.length) return { path: filepath, ref, lines: [], missing: true };
      let currentLines = splitLines(versions[0].text);
      let currentAssignments = currentLines.map(() => versions[0].commit);
      for (const version of versions.slice(1)) { const nextLines = splitLines(version.text); currentAssignments = diffLineAssignments(currentLines, nextLines, currentAssignments, version.commit); currentLines = nextLines; }
      return { path: filepath, ref, historyCount: history.length, lines: currentLines.map((text, index) => ({ number: index + 1, text, commit: currentAssignments[index] || versions[versions.length - 1].commit })) };
    }
    const CORS_PROXIES = [
      ...(location.hostname === 'localhost' || location.hostname === '127.0.0.1' ? ['http://127.0.0.1:3000/proxy/'] : []),
      'https://cors.isomorphic-git.org/',
    ];
    async function tryWithCorsProxies(operation, baseOptions, contextLabel) {
      let lastError;
      for (let i = 0; i < CORS_PROXIES.length; i++) {
        const proxy = CORS_PROXIES[i];
        try {
          footer.log('git', `${contextLabel} trying proxy[${i}] ${proxy}`, 'trace');
          const result = await operation({ ...baseOptions, corsProxy: proxy });
          footer.log('git', `${contextLabel} proxy[${i}] ${proxy} succeeded`, i === 0 ? 'debug' : 'info');
          return result;
        } catch (e) {
          lastError = e;
          footer.log('git', `${contextLabel} proxy[${i}] ${proxy} failed: ${e.message}`, 'trace');
        }
      }
      footer.log('git', `${contextLabel} all proxies exhausted`, 'warn');
      throw lastError;
    }
    async function fetchRepoRefs(repo, route = null, onProgress = null) { const selection = route?.branch ? { ref: route.branch } : {}; await tryWithCorsProxies((opts) => git.fetch({ fs, http, dir: repo.dir, url: repo.url, all:true, tags:true, force:true, prune:true, depth: route ? 12 : undefined, onProgress, ...selection, ...opts }), {}, `${repo.name} fetch-all`); }
    async function ensureRepo(repo, route = null) { try { await ensureDir(fs, '/repos'); const exists = await pathExists(fs, repo.dir); if (!exists) { setStatus(`${repo.name} cloning...`, 'checking'); await ensureDir(fs, repo.dir); await cloneWithSingleBranchFallback((options) => tryWithCorsProxies((opts) => git.clone({...options, ...opts}), options, `${repo.name} clone`), { fs, http, dir:repo.dir, url:repo.url, singleBranch:true, depth: route ? 12 : 1, onProgress: (progress) => { const msg = getGitProgressReporter(repo, 'clone', route)(progress); if (msg) footer.log('git', msg, 'trace'); } }, (error) => { footer.log('git', `${repo.name} clone failed with singleBranch=true: ${error.message}`, 'warn'); footer.log('git', `${repo.name} retrying clone with singleBranch=false`, 'warn'); }); footer.log('git', `${repo.name} cloned`, 'info', 'available'); } else { footer.log('git', `${repo.name} using cached clone`, 'info', 'available'); } setStatus(`${repo.name} fetching refs...`, 'checking'); await fetchRepoRefs(repo, route, (progress) => { const msg = getGitProgressReporter(repo, 'fetch', route)(progress); if (msg) footer.log('git', msg, 'trace'); }).catch(() => {}); footer.log('git', `${repo.name} refs ready`, 'info', 'available'); } catch (e) { setStatus(`prepare failed: ${e.message}`, 'unavailable'); footer.log('git', `prepare failed: ${e.message}`, 'error', 'unavailable'); throw e; } }
    async function readFileData(repo, route) { const localBranches = await git.listBranches({ fs, dir: repo.dir }).catch(() => []); const remoteBranches = await git.listBranches({ fs, dir: repo.dir, remote:'origin' }).catch(() => []); const branches = [...new Set([...localBranches, ...remoteBranches])].sort((a, b) => a.localeCompare(b)); const serverRefs = await tryWithCorsProxies((opts) => git.listServerRefs({ fs, http, url: repo.url, ...opts }), {}, `${repo.name} listServerRefs`).catch(() => []); const tags = [...new Set([...(await git.listTags({ fs, dir: repo.dir }).catch(() => [])), ...remoteTagNames(serverRefs)])].sort((a, b) => a.localeCompare(b)); const ref = resolveRefSelection(branches, tags, route); const selectedRef = route.commit || ref; const fileView = await buildFileBlame(repo, selectedRef, route.path).catch(() => null); const currentCommit = route.commit ? await git.readCommit({ fs, dir: repo.dir, oid: route.commit }).catch(() => null) : null; return { branches, tags, ref, selectedRef, currentCommit: currentCommit ? createCommitSummary({ oid: currentCommit.oid, commit: currentCommit.commit }) : null, fileView }; }
    function renderSplitView(repo, route, fileView) { if (!fileView) return '<div class="detail-empty muted">Select a file from the repo view to open blame.</div>'; if (fileView.binary) return `<div class="detail-empty muted"><div class="muted small">Blame</div><div style="margin-top:8px;">${escapeHtml(fileView.path)} is binary and cannot be shown.</div></div>`; if (fileView.missing || !fileView.lines.length) return `<div class="detail-empty muted"><div class="muted small">Blame</div><div style="margin-top:8px;">No content available for ${escapeHtml(fileView.path)}</div></div>`; return `<div class="blame-shell"><div class="blame-head"><div></div><div>Commit</div><div>Line</div><div>Time</div><div>Content</div></div><div>${fileView.lines.map((line) => { const hash = line.commit?.oid ? line.commit.oid.slice(0, 12) : 'n/a'; const fullOid = line.commit?.oid || ''; const href = fullOid ? repoBlameHref(repo, route, fullOid) : null; const hashCell = href ? `<a class="blame-hash mono" href="${href}" title="Open blame at ${escapeHtml(hash)}">${escapeHtml(hash)}</a>` : `<div class="blame-hash mono">${escapeHtml(hash)}</div>`; const parentOid = line.commit?.parents?.[0] || ''; const parentHref = parentOid ? repoBlameHref(repo, route, parentOid) : null; const parentCell = parentHref ? `<a class="blame-parent" href="${parentHref}" title="Blame parent commit">←</a>` : `<span class="blame-parent muted">·</span>`; const title = `${line.commit?.author || 'n/a'} · ${line.commit?.date || 'n/a'}`; return `<div class="blame-row" title="${escapeHtml(title)}"><div>${parentCell}</div><div>${hashCell}</div><div class="blame-lno mono">${line.number}</div><div class="blame-time">${escapeHtml(line.commit?.date || 'n/a')}</div><div class="blame-text">${escapeHtml(line.text || ' ')}</div></div>`; }).join('')}</div></div>`; }
    function renderRepoPicker() { viewEl.innerHTML = `<div class="repo-hero"><div class="repo-title-row"><div class="repo-title"><h2>Select a repository</h2><div class="small muted">Open a file from the repo page to use blame view.</div></div></div><div class="panel" style="margin-top:14px;"><div class="row">${repos.map((repo) => `<a class="button" href="${repoCodeHref(repo)}">${escapeHtml(repo.name)}</a>`).join('')}</div></div></div>`; }
    function renderPage(repo, data, route) { const selectedRef = route.commit || data.selectedRef || data.ref || 'n/a'; const branchSelected = route.branch && data.branches.includes(route.branch) ? route.branch : ''; const tagSelected = route.tag && data.tags.includes(route.tag) ? route.tag : ''; const selectedPath = route.path || 'n/a'; viewEl.innerHTML = `<div class="repo-hero"><div class="repo-breadcrumbs"><a href="./">repos</a><span>/</span><a href="${repoCodeHref(repo, route)}">${escapeHtml(repo.name)}</a><span>/</span><span class="mono">${escapeHtml(selectedPath)}</span></div><div class="repo-title-row"><div class="repo-title"><div class="repo-meta"><h2>${escapeHtml(repo.name)}</h2><span class="pill mono">${escapeHtml(selectedRef.slice(0, 12))}</span></div><div class="small muted">${escapeHtml(route.path || 'Select a file to inspect')}</div><div class="blob-meta"><span class="pill">Branch: <span class="mono">${escapeHtml(route.branch || data.ref || 'n/a')}</span></span><span class="pill">Tag: <span class="mono">${escapeHtml(route.tag || 'n/a')}</span></span><span class="pill">History: ${data.fileView?.historyCount || 0}</span></div></div><div class="row" style="justify-content:flex-end;"><a class="button" href="${repoCodeHref(repo, route)}">Open code view</a><a class="button" href="${repoCommitsHref(repo, route)}">Commits</a>${route.commit ? `<a class="button" href="${repoCommitHref(repo, route)}">Commit</a>` : ''}<a class="button" href="${repo.url}" target="_blank" rel="noreferrer noopener">Open upstream</a></div></div><div class="repo-tabs" role="tablist" aria-label="Repository sections"><a class="repo-tab" href="${repoCodeHref(repo, route)}">Code</a><a class="repo-tab" href="${repoCommitsHref(repo, route)}">Commits</a><a class="repo-tab${route.commit ? ' active' : ''}" href="${repoCommitHref(repo, route)}">Commit</a></div></div><div class="blob-shell"><div class="blob-toolbar"><div><div class="small muted">File</div><div class="mono" style="margin-top:4px;">${escapeHtml(selectedPath)}</div></div><div class="repo-toolbar"><select class="repo-select" data-branch-select>${buildSelectOptions(data.branches, branchSelected, 'Switch branch')}</select><select class="repo-select" data-tag-select>${buildSelectOptions(data.tags, tagSelected, 'Switch tag')}</select></div></div><div class="repo-sidebar-card" style="border:0; border-radius:0; background:transparent;"><div style="margin-top:0;">${renderSplitView(repo, route, data.fileView)}</div></div></div>`; }
    async function refresh() { const route = getRouteContext(repos); if (!route.repo) { setStatus('select a repository', 'idle'); renderRepoPicker(); return; } try { setStatus(`loading ${route.repo.name}...`, 'checking'); const probe = probeRemoteHost(route.repo).catch(() => false); await ensureRepo(route.repo, route); const data = await readFileData(route.repo, route); renderPage(route.repo, data, route); setStatus('ready', (await probe) ? 'available' : 'available'); } catch (e) { setStatus(`unavailable: ${e.message}`, 'unavailable'); viewEl.innerHTML = `<div class="detail-empty muted">${escapeHtml(e.message)}</div>`; } }
    viewEl.addEventListener('change', async (event) => { const target = event.target; if (!(target instanceof HTMLSelectElement)) return; const route = getRouteContext(repos); const next = { repo: route.repo, repoName: route.repoName, branch: route.branch, tag: route.tag, commit: route.commit, path: route.path }; if (target.matches('[data-branch-select]')) { next.branch = target.value || null; next.tag = null; } if (target.matches('[data-tag-select]')) { next.tag = target.value || null; next.branch = null; } const search = new URLSearchParams(); search.set('repo', route.repo.name); if (next.branch) search.set('branch', next.branch); if (next.tag) search.set('tag', next.tag); if (next.commit) search.set('commit', next.commit); if (next.path) search.set('path', next.path); window.history.replaceState({}, '', `./blame.html?${search.toString()}`); await refresh(); });
    refresh();
  </script>
</body>
</html>
