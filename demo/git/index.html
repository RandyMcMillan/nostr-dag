<!--
  nostr-dag Git Viewer

  Clones public git repositories into an in-browser LightningFS filesystem
  using isomorphic-git.  When a libp2p peer advertises a repo bundle via
  NIP-PIP (kind 39078 manifest + 39079 slices), the viewer fetches the
  bundle first and clones from it locally.  If no peer has the repo, it
  falls back to the isomorphic-git CORS proxy.

  See GIT_PROXY.md for the full decentralised git transport specification.
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="color-scheme" content="light dark" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' blob: 'wasm-unsafe-eval' https://cdn.jsdelivr.net https://esm.sh; worker-src 'self' blob: 'wasm-unsafe-eval' https://cdn.jsdelivr.net https://esm.sh; style-src 'self' 'unsafe-inline'; connect-src *; img-src 'self' data: https:; font-src 'self';" />
<link rel="icon" href="../shared/favicon.ico" />
<link rel="stylesheet" href="../shared/page.css" />
<title>nostr-dag Git Viewer</title>

</head>
<body>
  <header id="sharedHeader"></header>
  <main class="page-content">

  <div class="panel" id="repoPanel">
    <div class="row">
      <button id="refreshBtn" type="button">Refresh repos</button>
      <span id="status" class="status status-idle" title="Starting..."><span class="status-dot"></span></span>
    </div>
  </div>

  <div class="grid" id="repos"></div>

  </main>

  <footer id="pageFooter"></footer>

  <script type="module">
    import { scheduleAfterPaint } from '../shared/async-lifecycle.mjs';
    import { remoteTagNames } from '../shared/git-refs.mjs';
    import { createGitProgressReporter } from '../shared/git-progress.mjs';
    import { cloneWithSingleBranchFallback } from '../shared/git-clone.mjs';
    import { bootstrapGitChrome, GIT_REPOS, isSafariMobile, probeRemoteHost } from '../shared/git-page.mjs';
    import { createGitRepos, GitRepo } from '../shared/git-repo.mjs';
    import {
      buildSelectOptions,
      cacheRepoData,
      createCommitSummary,
      defaultRefForRefs,
      emptyRepoData,
      ensureDir,
      escapeHtml,
      getRouteContext,
      loadRefCache,
      loadRepoCache,
      pathExists,
      renderLatestSummary,
      repoBrowseAtCommitHref,
      repoCardStatusClass,
      repoCommitHref,
      repoCommitsHref,
      repoFileHref,
      repoSelectionHref,
      resolveRefSelection,
      saveRepoCache,
    } from '../shared/git-viewer.mjs';
    import git from '../vendor/isomorphic-git.mjs';
    import http from '../vendor/isomorphic-git-http-web.mjs';
    import LightningFS from '../vendor/lightning-fs.mjs';
    import { createGitP2PTransport, DEFAULT_RELAYS } from '../shared/git-p2p-transport.mjs';
    import { createBundleHttpClient } from '../shared/git-bundle-http.mjs';

    const fs = new LightningFS('git-viewer');
    const gitRepos = createGitRepos(GIT_REPOS);
    const repoHealth = new Map();
    const repoPing = new Map();
    const repoSource = new Map();
    const faviconCache = new Map();
    const refreshingRepos = new Set();

    // Proxy chain for git smart-HTTP requests.
    // Public CORS proxies have become unreliable (Cloudflare blocks, API keys,
    // rate limits).  On GH Pages only the localhost proxy is unavailable, so
    // the primary fetch path is the libp2p P2P bundle (see GitP2PTransport).
    // If you run nostr-dag-server publicly you can append its /proxy/ URL here.
    const CORS_PROXIES = [
      'http://127.0.0.1:3000/proxy/',
      'https://cors.isomorphic-git.org/',
    ];

    let activeProxy = null;

    async function tryWithCorsProxies(operation, baseOptions, contextLabel) {
      let lastError;
      const previousProxy = activeProxy;
      for (let i = 0; i < CORS_PROXIES.length; i++) {
        const proxy = CORS_PROXIES[i];
        try {
          footer.log('git', `${contextLabel} trying proxy[${i}] ${proxy}`, 'trace');
          const result = await operation({ ...baseOptions, corsProxy: proxy });
          activeProxy = proxy;
          if (previousProxy !== proxy) {
            footer.log('git', `proxy switched: ${previousProxy || 'none'} → ${proxy}`, 'info');
          }
          footer.log('git', `${contextLabel} proxy[${i}] ${proxy} succeeded`, i === 0 ? 'debug' : 'info');
          return result;
        } catch (e) {
          lastError = e;
          footer.log('git', `${contextLabel} proxy[${i}] ${proxy} failed: ${e.message}`, 'debug');
        }
      }
      if (activeProxy !== null) {
        footer.log('git', `proxy switched: ${previousProxy || 'none'} → none (all exhausted)`, 'warn');
      }
      activeProxy = null;
      footer.log('git', `${contextLabel} all proxies exhausted — CORS proxies blocked or unavailable`, 'warn');
      const enhanced = new Error(`${lastError.message} (CORS proxy blocked — run nostr-dag-server locally or wait for P2P peer)`);
      enhanced.cause = lastError;
      throw enhanced;
    }

    function warmFavicon(url) {
      if (faviconCache.has(url)) {
        return;
      }
      const image = new Image();
      image.decoding = 'async';
      image.referrerPolicy = 'no-referrer';
      image.src = url;
      faviconCache.set(url, image);
    }

    GIT_REPOS.forEach((repo) => warmFavicon(`${new URL(repo.url).origin}/favicon.ico`));

    const statusEl = document.getElementById('status');
    const reposEl = document.getElementById('repos');
    const repoState = new Map();
    const repos = GIT_REPOS;
    const { networkTime, footer } = bootstrapGitChrome({
      headerRoot: document.getElementById('sharedHeader'),
      footerRoot: document.getElementById('pageFooter'),
    });
    footer.setLevel('info');
    footer.log('git', 'module loaded', 'debug');
    window.addEventListener('error', (event) => {
      footer.log('git', `uncaught error: ${event.message} at ${event.filename}:${event.lineno}`, 'error', 'unavailable');
    });
    window.addEventListener('unhandledrejection', (event) => {
      footer.log('git', `unhandled rejection: ${event.reason?.message || event.reason}`, 'error', 'unavailable');
    });
    const refreshBtn = document.getElementById('refreshBtn');
    const repoPanel = document.getElementById('repoPanel');

    /**
     * Process 1a: P2P Transport Bootstrap (original, preserved)
     * Trigger: scheduleAfterPaint() on page load
     * Network: Yes (connects to Nostr relays for bundle discovery)
     * Scope: Global — sets up libp2p node and GitP2PTransport for all repos
     */
    async function initGitP2P() {
      try {
        if (isSafariMobile()) {
          footer.log('libp2p', 'skipping libp2p bootstrap on Safari mobile', 'info', 'idle');
          return;
        }
        const { createSharedLibp2pStack } = await import('../shared/libp2p-stack.mjs');
        const { node } = await createSharedLibp2pStack({
          onLog(level, text, state) {
            footer.log('libp2p', text, level, state);
          },
          onPeer({ kind, peer, detail }) {
            footer.log('libp2p', `${kind}: ${peer}`, 'debug', kind === 'connected' ? 'available' : 'checking');
            footer.log('libp2p', `${kind} detail: ${detail ? JSON.stringify(detail) : 'none'}`, 'trace', kind === 'connected' ? 'available' : 'checking');
          },
        });
        window.__gitViewerP2pNode = node;
        networkTime.attachNode(node);
        const p2pTransport = await createGitP2PTransport({
          node,
          relays: DEFAULT_RELAYS,
          onLog(level, text) {
            footer.log('git-p2p', text, level);
          },
        });
        window.__gitViewerP2pTransport = p2pTransport;
        footer.log('libp2p', `node ready: ${node.peerId.toString()}`, 'info', 'available');
      } catch (e) {
        footer.log('libp2p', `bootstrap failed: ${e.message}`, 'error', 'unavailable');
      }
    }

    /**
     * Process 1b: Non-P2P Transport Bootstrap (proxy-only)
     * Trigger: call instead of initGitP2P when troubleshooting or on slow networks
     * Network: No — uses CORS proxy only, no libp2p, no relay connections
     * Scope: Global — clears P2P transport so ensureRepo skips bundle fetch
     */
    async function initGitTransport() {
      window.__gitViewerP2pTransport = null;
      window.__gitViewerP2pNode = null;
      networkTime.attachNode(null);
      footer.log('git', 'proxy-only mode (no P2P)', 'info', 'available');
    }

    // Delay libp2p bootstrap until after the first frame so initial layout and
    // header controls stay responsive even on slower/mobile browsers.
    scheduleAfterPaint(() => {
      // Toggle: use initGitTransport() for proxy-only, initGitP2P() for full P2P
      void initGitTransport();
      // void initGitP2P();
    });

    function setStatus(text, state = 'idle') {
      statusEl.className = `status status-${state}`;
      statusEl.title = text;
      const level = state === 'unavailable' ? 'warn' : state === 'checking' ? 'debug' : 'info';
      footer.log('git', text, level, state);
      footer.setState(state, text);
    }

    function setRepoStatus(repoName, text) {
      repoState.set(repoName, text);
      const r = gitRepos.find((gr) => gr.name === repoName);
      if (r) r.status = text;
    }

    function setRepoHealth(repoName, state) {
      repoHealth.set(repoName, state);
      const r = gitRepos.find((gr) => gr.name === repoName);
      if (r) r.health = state;
    }

    function getRepoHealth(repoName) {
      return repoHealth.get(repoName) || 'idle';
    }

    function setRepoPing(repoName, ms) {
      repoPing.set(repoName, ms);
      const r = gitRepos.find((gr) => gr.name === repoName);
      if (r) r.ping = ms;
    }

    function getRepoPing(repoName) {
      return repoPing.get(repoName) || null;
    }

    function repoHealthClass(state) {
      if (state === 'checking') return 'health-checking';
      if (state === 'available') return 'health-available';
      if (state === 'unavailable') return 'health-unavailable';
      return 'health-idle';
    }

    function createRepoCardModel(gitRepo) {
      const model = gitRepo.toCardModel();
      const p2pAvailable = window.__gitViewerP2pTransport?.hasRepo(gitRepo.url) || false;
      return {
        ...model,
        p2pAvailable,
        proxy: activeProxy,
        source: repoSource.get(gitRepo.name) || model.source,
        toolbar: {
          ...model.toolbar,
          secondaryHref: repoSelectionHref(model.repo, {
            branch: model.selectedBranch || null,
            tag: model.selectedTag || null,
          }),
          secondaryLabel: 'View repo',
          commitsHref: repoCommitsHref(model.repo, {
            branch: model.selectedBranch || null,
            tag: model.selectedTag || null,
          }),
        },
      };
    }

    function renderRepoCard(card) {
      return `
        <div class="repo">
          <div class="row" style="justify-content:space-between;align-items:center;gap:8px;">
            <h3 class="row" style="gap:8px;align-items:center;margin:0;">
              <a href="${card.repo.url}" target="_blank" rel="noreferrer noopener" aria-label="${card.repo.name} upstream">
                <img src="${card.iconUrl}" alt="" width="16" height="16" loading="eager" fetchpriority="high" style="border-radius:3px;" />
              </a>
              <a href="${card.repo.url}" target="_blank" rel="noreferrer noopener">${card.repo.name}</a>
            </h3>
            <div class="small muted" style="text-align:right;">
              <a href="${card.repo.url}" target="_blank" rel="noreferrer noopener">${card.repo.url}</a>
            </div>
          </div>
          <div class="small" style="margin-top:8px;"><span class="muted">Status:</span> <span class="health-badge ${repoCardStatusClass(card.status)}" title="${escapeHtml(card.status)}"><span class="health-dot"></span></span>${card.ping !== null ? ` <span class="muted">ping:</span> <span class="mono">${card.ping} ms</span>` : ''}${card.p2pAvailable ? ' <span class="health-badge health-available" title="libp2p"><span class="health-dot"></span></span><span class="muted">p2p</span>' : ''}${card.source ? ` <span class="pill pill-source-${card.source}" title="${card.source === 'proxy' ? 'Fetched via CORS proxy (fallback)' : card.source === 'p2p' ? 'Fetched from libp2p peer bundle' : 'Source: ' + card.source}">${card.source}${card.proxy && card.source === 'proxy' ? ` • ${card.proxy}` : ''}</span>` : ''}</div>
          <div class="small" style="margin-top:8px;"><span class="muted">Ref:</span> <span class="mono">${card.ref}</span></div>
          <div class="small" style="margin-top:4px;"><span class="muted">Selected:</span> <span class="mono">${escapeHtml(card.selectedRef)}</span></div>
          <div class="small" style="margin-top:8px;">${card.latestHtml}</div>
          <div class="small" style="margin-top:8px;">
            <div class="muted">Branches</div>
            <select data-branch-select="${card.repo.name}" style="width:100%; margin-top:6px;">
              ${buildSelectOptions(card.branches, card.selectedBranch, 'Quick jump branch')}
            </select>
          </div>
          <div class="small" style="margin-top:8px;">
            <div class="muted">Tags</div>
            <select data-tag-select="${card.repo.name}" style="width:100%; margin-top:6px;">
              ${buildSelectOptions(card.tagsList, card.selectedTag, 'Quick jump tag')}
            </select>
          </div>
          <div class="row" style="margin-top:12px; justify-content:flex-end;">
            <button class="repo-refresh" type="button" data-refresh-repo="${card.toolbar.refreshId}">Refresh</button>
            <button class="button" type="button" data-view-repo="${card.toolbar.refreshId}">${card.toolbar.secondaryLabel}</button>
            <button class="button" type="button" data-view-commits="${card.toolbar.refreshId}">Commits</button>
            <a class="button" href="${card.toolbar.primaryHref}" target="_blank" rel="noreferrer noopener">${card.toolbar.primaryLabel}</a>
          </div>
        </div>
      `;
    }

    function repoCard(repo, data) {
      const gitRepo = gitRepos.find((gr) => gr.name === repo.name);
      if (gitRepo) {
        gitRepo.data = { ...gitRepo.data, ...data };
        return renderRepoCard(createRepoCardModel(gitRepo));
      }
      // Defensive fallback — should never happen because gitRepos is created from GIT_REPOS.
      const fallback = new GitRepo(repo);
      if (data) fallback.data = { ...fallback.data, ...data };
      return renderRepoCard(createRepoCardModel(fallback));
    }

    function estimateRecentCommitLimit(fileCount) {
      return Math.max(1, Math.round(Math.max(1, fileCount) / 5.0));
    }

    async function branchForCommit(repoDir, branches, commitOid) {
      if (!commitOid || !branches.length) return '';
      const matches = await Promise.all(branches.map(async (branch) => {
        try {
          const branchOid = await git.resolveRef({ fs, dir: repoDir, ref: branch });
          return branchOid === commitOid ? branch : '';
        } catch {
          return '';
        }
      }));
      return matches.find(Boolean) || '';
    }

    async function collectCommitDecorations(repo, localBranches, remoteBranches, route, commits) {
      const decorationsByOid = new Map();
      const branchNames = [...new Set([
        ...localBranches,
        ...remoteBranches.filter((name) => name && name !== 'HEAD'),
      ])];

      async function addDecoration(ref, label) {
        try {
          const oid = await git.resolveRef({ fs, dir: repo.dir, ref });
          if (!decorationsByOid.has(oid)) decorationsByOid.set(oid, []);
          const labels = decorationsByOid.get(oid);
          if (!labels.includes(label)) labels.push(label);
          return oid;
        } catch {
          return null;
        }
      }

      await Promise.all([
        ...localBranches.map((branch) => addDecoration(branch, branch)),
        ...remoteBranches
          .filter((branch) => branch && branch !== 'HEAD')
          .map((branch) => addDecoration(`origin/${branch}`, `origin/${branch}`)),
      ]);

      const headBranch = route?.branch || defaultRefForRefs(branchNames, []);
      if (headBranch) {
        const headOid = (await addDecoration(`origin/${headBranch}`, `HEAD -> ${headBranch}`))
          || (await addDecoration(headBranch, `HEAD -> ${headBranch}`));
        if (headOid && remoteBranches.includes(headBranch)) {
          await addDecoration(`origin/${headBranch}`, `origin/${headBranch}`);
          if (headBranch === 'master' || headBranch === 'main') {
            await addDecoration(`origin/${headBranch}`, 'origin/HEAD');
          }
        }
      }

      return commits.map((commit) => ({
        ...commit,
        decorations: decorationsByOid.get(commit.oid) || [],
      }));
    }

    function selectedRefForRoute(route) {
      if (route?.branch) return route.branch;
      if (route?.tag) return route.tag;
      return null;
    }

    function refCandidatesForRoute(route, branches, tags) {
      if (route?.branch) {
        return [
          route.branch,
          `origin/${route.branch}`,
          `refs/remotes/origin/${route.branch}`,
          `refs/heads/${route.branch}`,
        ];
      }
      if (route?.tag) {
        return [
          route.tag,
          `refs/tags/${route.tag}`,
        ];
      }
      return [defaultRefForRefs(branches, tags), 'HEAD'];
    }

    function fetchSelectionOptions(route) {
      // Do not pass singleBranch: true here. Combining singleBranch with all: true
      // causes isomorphic-git to skip tag fetching, which empties the tag dropdown
      // when a branch is selected. Omitting singleBranch lets all: true + tags: true
      // fetch all branches and tags as expected.
      if (route?.branch) {
        return { ref: route.branch };
      }
      if (route?.tag) {
        return { ref: `refs/tags/${route.tag}` };
      }
      return {};
    }

    async function flattenTreeEntries(repo, treeOid, prefix = '') {
      if (!treeOid) return [];
      const tree = await git.readTree({ fs, dir: repo.dir, oid: treeOid }).catch(() => null);
      if (!tree?.tree) return [];
      const entries = [];
      for (const entry of tree.tree) {
        const path = prefix ? `${prefix}/${entry.path}` : entry.path;
        if (entry.type === 'tree') {
          entries.push(...await flattenTreeEntries(repo, entry.oid, path));
        } else {
          entries.push({
            path,
            oid: entry.oid,
            mode: entry.mode,
            type: entry.type,
          });
        }
      }
      return entries;
    }

    function decodeBlob(bytes) {
      if (!bytes) return '';
      return new TextDecoder('utf-8').decode(bytes);
    }

    function isBinaryBytes(bytes) {
      return bytes && Array.from(bytes).includes(0);
    }

    function splitLines(text) {
      return String(text || '').replace(/\r\n/g, '\n').split('\n');
    }

    function diffLines(beforeText, afterText) {
      const before = splitLines(beforeText);
      const after = splitLines(afterText);
      const rows = Array.from({ length: before.length + 1 }, () => Array(after.length + 1).fill(0));
      for (let i = before.length - 1; i >= 0; i -= 1) {
        for (let j = after.length - 1; j >= 0; j -= 1) {
          rows[i][j] = before[i] === after[j]
            ? rows[i + 1][j + 1] + 1
            : Math.max(rows[i + 1][j], rows[i][j + 1]);
        }
      }
      const lines = [];
      let i = 0;
      let j = 0;
      while (i < before.length && j < after.length) {
        if (before[i] === after[j]) {
          lines.push(` ${before[i]}`);
          i += 1;
          j += 1;
        } else if (rows[i + 1][j] >= rows[i][j + 1]) {
          lines.push(`-${before[i]}`);
          i += 1;
        } else {
          lines.push(`+${after[j]}`);
          j += 1;
        }
      }
      while (i < before.length) {
        lines.push(`-${before[i]}`);
        i += 1;
      }
      while (j < after.length) {
        lines.push(`+${after[j]}`);
        j += 1;
      }
      return lines;
    }

    async function readTreeBlobText(repo, treeOid, filepath) {
      const blob = await git.readBlob({ fs, dir: repo.dir, oid: treeOid, filepath }).catch(() => null);
      if (!blob?.blob) return null;
      return blob.blob;
    }

    async function buildPatchForPath(repo, currentTreeOid, parentTreeOid, path, status) {
      const currentBytes = currentTreeOid ? await readTreeBlobText(repo, currentTreeOid, path) : null;
      const parentBytes = parentTreeOid ? await readTreeBlobText(repo, parentTreeOid, path) : null;
      if ((currentBytes && isBinaryBytes(currentBytes)) || (parentBytes && isBinaryBytes(parentBytes))) {
        return ['Binary files differ'];
      }
      const before = parentBytes ? decodeBlob(parentBytes) : '';
      const after = currentBytes ? decodeBlob(currentBytes) : '';
      const prefix = status === 'added' ? ['--- /dev/null', `+++ b/${path}`]
        : status === 'deleted' ? [`--- a/${path}`, '+++ /dev/null']
          : [`--- a/${path}`, `+++ b/${path}`];
      return [
        `diff --git a/${path} b/${path}`,
        ...prefix,
        ...diffLines(before, after),
      ];
    }

    async function buildCommitDiff(repo, commitOid, parentOid = null) {
      if (!commitOid) return [];
      const commit = await git.readCommit({ fs, dir: repo.dir, oid: commitOid }).catch(() => null);
      const commitTreeOid = commit?.commit?.tree || '';
      const resolvedParentOid = parentOid || commit?.commit?.parent?.[0] || '';
      const parentTreeOid = resolvedParentOid
        ? (await git.readCommit({ fs, dir: repo.dir, oid: resolvedParentOid }).catch(() => null))?.commit?.tree || ''
        : '';
      const [currentEntries, parentEntries] = await Promise.all([
        flattenTreeEntries(repo, commitTreeOid),
        flattenTreeEntries(repo, parentTreeOid),
      ]);
      const currentByPath = new Map(currentEntries.map((entry) => [entry.path, entry]));
      const parentByPath = new Map(parentEntries.map((entry) => [entry.path, entry]));
      const paths = [...new Set([...currentByPath.keys(), ...parentByPath.keys()])].sort((a, b) => a.localeCompare(b));
      const diffs = [];
      for (const path of paths) {
        const current = currentByPath.get(path) || null;
        const parent = parentByPath.get(path) || null;
        if (current && !parent) {
          diffs.push({
            path,
            status: 'added',
            patch: await buildPatchForPath(repo, commitTreeOid, null, path, 'added'),
          });
        } else if (!current && parent) {
          diffs.push({
            path,
            status: 'deleted',
            patch: await buildPatchForPath(repo, null, parentTreeOid, path, 'deleted'),
          });
        } else if (current && parent && current.oid !== parent.oid) {
          diffs.push({
            path,
            status: 'modified',
            patch: await buildPatchForPath(repo, commitTreeOid, parentTreeOid, path, 'modified'),
          });
        }
      }
      return diffs;
    }

    const gitProgressReporters = new Map();
    const GIT_HISTORY_DEPTH = 12;

    function progressContextLabel(route) {
      if (route?.branch) return `branch ${route.branch}`;
      if (route?.tag) return `tag ${route.tag}`;
      return '';
    }

    function getGitProgressReporter(repo, operation, route = null) {
      const context = progressContextLabel(route);
      const key = `${repo.name}:${operation}:${context}`;
      if (!gitProgressReporters.has(key)) {
        gitProgressReporters.set(key, createGitProgressReporter(repo.name, operation, context));
      }
      return gitProgressReporters.get(key);
    }

    async function wipeRepo(repo) {
      footer.log('git', `${repo.name} wiping cached clone`, 'info');
      repoHealth.delete(repo.name);
      repoPing.delete(repo.name);
      repoSource.delete(repo.name);
      const dir = repo.dir;
      async function rmrf(path) {
        try {
          const stat = await fs.promises.stat(path);
          if (stat.isDirectory()) {
            const items = await fs.promises.readdir(path);
            for (const item of items) {
              await rmrf(`${path}/${item}`);
            }
            await fs.promises.rmdir(path);
          } else {
            await fs.promises.unlink(path);
          }
        } catch (e) {
          // ignore missing paths
        }
      }
      await rmrf(dir);
    }

    /**
     * Process 7 (inside ensureRepo): P2P Bundle Request
     * Trigger: Called by refreshList/refreshDetail/refreshOneRepo for each repo
     * Network: Yes — tries libp2p bundle first, falls back to CORS proxy clone/fetch
     * Scope: Per repo — may clone from bundle, clone from proxy, or reuse cached clone
     */
    async function ensureRepo(repo, route = null, { skipP2P = false, fetchAll = false } = {}) {
      const url = repo.url;
      const dir = repo.dir;
      const ensureStart = performance.now();
      footer.log('git', `ensureRepo start ${repo.name} skipP2P=${skipP2P} fetchAll=${fetchAll}`, 'debug');
      let exists = false;
      try {
        await ensureDir(fs, '/repos');

        // Try libp2p bundle fetch first (only when P2P transport is active)
        let bundlePath = null;
        const transport = window.__gitViewerP2pTransport;
        if (transport && !skipP2P) {
          try {
            setRepoStatus(repo.name, 'fetching p2p bundle...');
            footer.log('git', `${repo.name} requesting bundle via libp2p`, 'info');
            const bundle = await transport.requestBundle(url, 15000);
            bundlePath = `/bundles/${repo.name}.bundle`;
            await ensureDir(fs, '/bundles');
            await fs.writeFile(bundlePath, bundle);
            footer.log('git', `${repo.name} p2p bundle received bytes=${bundle.length}`, 'info', 'available');
            setRepoHealth(repo.name, 'available');
          } catch (p2pErr) {
            footer.log('git', `${repo.name} p2p bundle failed: ${p2pErr.message}`, 'warn');
          }
        }

        exists = await pathExists(fs, dir);
        let isValid = false;
        if (exists) {
          try {
            await git.resolveRef({ fs, dir, ref: 'HEAD' });
            isValid = true;
          } catch (e) {
            footer.log('git', `${repo.name} existing clone invalid (${e.message}) — will re-clone`, 'warn');
          }
        }
        if (!isValid) {
          setRepoStatus(repo.name, 'cloning...');
          footer.log('git', `${repo.name} cloning${route ? ` (${progressContextLabel(route)})` : ''}`, 'debug');
          await ensureDir(fs, dir);

          // If we have a bundle, clone from it using the custom bundle HTTP transport.
          let clonedFromBundle = false;
          if (bundlePath) {
            try {
              const bundleHttp = createBundleHttpClient({ fs, bundlePath });
              await git.clone({
                fs,
                http: bundleHttp,
                dir,
                url: 'bundle://local',
                singleBranch: false,
                onProgress: (progress) => {
                  const message = getGitProgressReporter(repo, 'clone', route)(progress);
                  if (message) footer.log('git', `[bundle] ${message}`, 'trace');
                },
              });
              clonedFromBundle = true;
              repoSource.set(repo.name, 'p2p');
              footer.log('git', `${repo.name} cloned from libp2p bundle`, 'info', 'available');
            } catch (bundleErr) {
              footer.log('git', `${repo.name} bundle clone failed: ${bundleErr.message}`, 'warn');
            }
          }

          if (!clonedFromBundle) {
            repoSource.set(repo.name, 'proxy');
            const cloneOptions = {
              fs,
              http,
              dir,
              url,
              singleBranch: true,
              depth: route ? GIT_HISTORY_DEPTH : 1,
              onProgress: (progress) => {
                const message = getGitProgressReporter(repo, 'clone', route)(progress);
                if (message) {
                  footer.log('git', message, 'trace');
                }
              },
            };
            await cloneWithSingleBranchFallback(
              (options) => tryWithCorsProxies((opts) => git.clone(opts), options, `${repo.name} clone`),
              cloneOptions,
              (error) => {
                footer.log('git', `${repo.name} clone failed with singleBranch=true: ${error.message}`, 'warn');
                footer.log('git', `${repo.name} retrying clone with singleBranch=false`, 'warn');
              },
            );
          }
          footer.log('git', `${repo.name} clone done in ${Math.round(performance.now() - ensureStart)} ms`, 'debug');
        } else {
          setRepoStatus(repo.name, 'reusing cached clone...');
          footer.log('git', `${repo.name} reusing cached clone`, 'info');
        }
      } catch (e) {
        setRepoStatus(repo.name, `prepare failed: ${e.message}`);
        footer.log('git', `prepare failed: ${e.message}`, 'error', 'unavailable');
        throw e;
      }

      const cache = loadRepoCache();
      const hasCachedRefs = cache[repo.name]?.tags?.length > 0 || cache[repo.name]?.branches?.length > 0;
      if (!exists || !hasCachedRefs || fetchAll) {
        setRepoStatus(repo.name, fetchAll ? 'syncing all refs...' : 'fetching tags...');
        const fetchStart = performance.now();
        footer.log('git', `${repo.name} fetching tags${route ? ` (${progressContextLabel(route)})` : ''}`, 'debug');
        await fetchRepoRefs(repo, route, (progress) => {
          const message = getGitProgressReporter(repo, 'fetch', route)(progress);
          if (message) {
            footer.log('git', message, 'trace');
          }
        }).catch((e) => {
          footer.log('git', `${repo.name} fetch failed: ${e.message}`, 'warn');
        });
        footer.log('git', `${repo.name} fetch done in ${Math.round(performance.now() - fetchStart)} ms proxy=${activeProxy || 'none'}`, 'debug');
      } else {
        setRepoStatus(repo.name, 'using cached refs');
        footer.log('git', `${repo.name} skipping fetch — cached refs available`, 'info');
      }
      setRepoStatus(repo.name, 'ready');
      footer.log('git', `${repo.name} ensureRepo complete in ${Math.round(performance.now() - ensureStart)} ms`, 'debug');
    }

    async function fetchRepoRefs(repo, route = null, onProgress = null) {
      const selection = fetchSelectionOptions(route);
      // isomorphic-git can skip tag fetching when a specific ref is combined with
      // all: true.  We do a targeted fetch for the ref first, then a second
      // fetch without ref constraints so tags are always refreshed.
      if (selection.ref) {
        await tryWithCorsProxies(
          (opts) => git.fetch({ fs, http, dir: repo.dir, url: repo.url, force: true, depth: route ? GIT_HISTORY_DEPTH : undefined, onProgress, ...selection, ...opts }),
          {},
          `${repo.name} fetch-ref`,
        ).catch((e) => {
          footer.log('git', `${repo.name} fetch-ref ${selection.ref} failed: ${e.message}`, 'warn');
        });
      }
      // Fetch all refs and tags without depth limit so older tags (e.g. v0.13.0)
      // are not silently omitted by a shallow fetch.
      await tryWithCorsProxies(
        (opts) => git.fetch({ fs, http, dir: repo.dir, url: repo.url, all: true, tags: true, force: true, prune: true, onProgress, ...opts }),
        {},
        `${repo.name} fetch-all`,
      );
    }

    async function readRepo(repo, route = null, { skipNetwork = false } = {}) {
      const readStart = performance.now();
      footer.log('git', `readRepo start ${repo.name} skipNetwork=${skipNetwork}`, 'debug');
      const localBranches = await git.listBranches({ fs, dir: repo.dir }).catch((e) => {
        footer.log('git', `${repo.name} listBranches failed: ${e.message}`, 'warn');
        return [];
      });
      const remoteBranches = await git.listBranches({ fs, dir: repo.dir, remote: 'origin' }).catch((e) => {
        footer.log('git', `${repo.name} listBranches(remote) failed: ${e.message}`, 'warn');
        return [];
      });
      const cache = loadRepoCache();
      const refCache = loadRefCache();
      const cached = cache[repo.name];
      const refs = refCache[repo.name];
      // Merge versioned cache with unversioned ref cache so tags/branches survive bumps.
      const mergedCached = { ...cached, ...refs };
      const cachedBranches = mergedCached?.branches || [];
      const branches = [...new Set([...localBranches, ...remoteBranches, ...cachedBranches])];
      footer.log('git', `${repo.name} listBranches done in ${Math.round(performance.now() - readStart)} ms`, 'trace');
      const hasCachedRefs = mergedCached && (mergedCached.tags?.length > 0 || mergedCached.branches?.length > 0);
      let serverRefs = [];
      if (!skipNetwork || !hasCachedRefs) {
        serverRefs = await tryWithCorsProxies(
          (opts) => git.listServerRefs({ fs, http, url: repo.url, ...opts }),
          {},
          `${repo.name} listServerRefs`,
        ).catch((e) => {
          footer.log('git', `${repo.name} listServerRefs failed: ${e.message}`, 'warn');
          return [];
        });
        footer.log('git', `${repo.name} listServerRefs done refs=${serverRefs.length} in ${Math.round(performance.now() - readStart)} ms`, 'trace');
      } else {
        serverRefs = mergedCached.serverRefs || [];
        footer.log('git', `${repo.name} using cached serverRefs (${serverRefs.length})`, 'info');
      }
      const localTags = await git.listTags({ fs, dir: repo.dir }).catch((e) => {
        footer.log('git', `${repo.name} listTags failed: ${e.message}`, 'warn');
        return [];
      });
      if (branches.length === 0 && localTags.length === 0) {
        footer.log('git', `${repo.name} local clone appears empty or invalid (no branches/tags)`, 'warn');
      }
      const cachedTags = mergedCached?.tags || [];
      const remoteTags = remoteTagNames(serverRefs);
      const tags = [...new Set([
        ...localTags,
        ...remoteTags,
        ...cachedTags,
      ])];
      tags.sort((a, b) => a.localeCompare(b));
      // Build tagMap from server refs so consumers can resolve tag -> commit.
      const tagMap = {};
      for (const entry of serverRefs) {
        const refStr = String(entry?.ref || '');
        if (!refStr.startsWith('refs/tags/')) continue;
        const tagName = refStr.replace('refs/tags/', '').replace(/\^\{\}$/u, '');
        if (!tagName) continue;
        tagMap[tagName] = entry.oid || tagMap[tagName] || '';
      }
      const ref = resolveRefSelection(branches, tags, route || {});
      const selectedRef = selectedRefForRoute(route) || ref;
      footer.log('git', `readRepo refs ${repo.name} branches=${branches.length} tags=${tags.length} ref=${ref} selectedRef=${selectedRef}`, 'debug');
      const candidates = refCandidatesForRoute(route, branches, tags);
      let commits = [];
      let resolvedRef = ref;
      let reloadedAfterMiss = false;
      const logStart = performance.now();
      for (const candidate of candidates) {
        if (!candidate) continue;
        try {
          commits = await git.log({ fs, dir: repo.dir, ref: candidate, depth: GIT_HISTORY_DEPTH });
          resolvedRef = candidate;
          footer.log('git', `readRepo ${repo.name} git.log candidate=${candidate} commits=${commits.length}`, 'debug');
          break;
        } catch (e) {
          commits = [];
          footer.log('git', `readRepo ${repo.name} git.log candidate=${candidate} failed: ${e.message}`, 'debug');
        }
      }
      footer.log('git', `${repo.name} git.log done in ${Math.round(performance.now() - logStart)} ms`, 'trace');
      if (!commits.length && route?.tag && !reloadedAfterMiss) {
        reloadedAfterMiss = true;
        footer.log('git', `readRepo tag miss ${repo.name} tag=${route.tag} refetching`, 'debug');
        await fetchRepoRefs(repo, route).catch((e) => {
          footer.log('git', `${repo.name} refetch after tag miss failed: ${e.message}`, 'warn');
        });
        const retryLocalTags = await git.listTags({ fs, dir: repo.dir }).catch((e) => {
          footer.log('git', `${repo.name} listTags retry failed: ${e.message}`, 'warn');
          return [];
        });
        const retryServerRefs = await tryWithCorsProxies(
          (opts) => git.listServerRefs({ fs, http, url: repo.url, ...opts }),
          {},
          `${repo.name} listServerRefs retry`,
        ).catch((e) => {
          footer.log('git', `${repo.name} listServerRefs retry failed: ${e.message}`, 'warn');
          return [];
        });
        const retryTags = [...new Set([
          ...retryLocalTags,
          ...remoteTagNames(retryServerRefs),
          ...cachedTags,
        ])];
        retryTags.sort((a, b) => a.localeCompare(b));
        for (const candidate of refCandidatesForRoute(route, branches, retryTags)) {
          if (!candidate) continue;
          try {
            commits = await git.log({ fs, dir: repo.dir, ref: candidate, depth: GIT_HISTORY_DEPTH });
            resolvedRef = candidate;
            footer.log('git', `readRepo retry ${repo.name} git.log candidate=${candidate} commits=${commits.length}`, 'debug');
            break;
          } catch (e) {
            commits = [];
            footer.log('git', `readRepo retry ${repo.name} git.log candidate=${candidate} failed: ${e.message}`, 'debug');
          }
        }
      }
      let selectedCommit = null;
      if (route?.commit) {
        selectedCommit = commits.find((commit) => commit.oid === route.commit || commit.oid.startsWith(route.commit)) || null;
        if (!selectedCommit) {
          footer.log('git', `readRepo commit not in log ${repo.name} ${route.commit} fetching direct`, 'debug');
          const directCommit = await git.log({ fs, dir: repo.dir, ref: route.commit, depth: 1 }).catch(() => []);
          selectedCommit = directCommit[0] ? createCommitSummary(directCommit[0]) : null;
        }
      }
      const snapshotRef = route?.commit ? (selectedCommit?.oid || route.commit) : resolvedRef;
      const commitDiff = route?.commit && snapshotRef
        ? await buildCommitDiff(repo, snapshotRef, selectedCommit?.parents?.[0] || null)
        : [];
      const latestCommit = commits[0] || null;
      const latest = latestCommit?.commit?.message || 'n/a';
      const branchForSelection = route?.tag
        ? await branchForCommit(repo.dir, branches, latestCommit?.oid || '')
        : '';
      // Prefer the concrete commit OID for listFiles so that remote-tracking
      // ref strings like 'origin/branch' cannot cause silent resolution failures.
      const filesRef = (route?.commit ? null : latestCommit?.oid) || snapshotRef;
      const files = await git.listFiles({ fs, dir: repo.dir, ref: filesRef }).catch(async () => {
        if (filesRef !== snapshotRef) {
          return git.listFiles({ fs, dir: repo.dir, ref: snapshotRef }).catch(() => []);
        }
        return [];
      });
      const commitLimit = estimateRecentCommitLimit(files.length);
      footer.log('git', `readRepo done ${repo.name} commits=${commits.length} files=${files.length} snapshotRef=${snapshotRef} total=${Math.round(performance.now() - readStart)} ms`, 'debug');
      const decoratedCommits = await collectCommitDecorations(repo, localBranches, remoteBranches, route, commits.slice(0, commitLimit).map(createCommitSummary));
      return {
        latest,
        latestCommit: latestCommit ? createCommitSummary(latestCommit) : null,
        selectedCommit,
        commitDiff,
        files: files.slice(0, 100),
        tags,
        tagMap,
        serverRefs,
        branches: branches.sort((a, b) => a.localeCompare(b)),
        ref,
        defaultRef: defaultRefForRefs(branches, tags),
        selectedRef,
        resolvedRef,
        snapshotRef,
        branchForSelection,
        commits: decoratedCommits,
      };
    }

    function renderRepoList(results = null) {
      const data = results || repos.map((repo) => {
        const gr = gitRepos.find((g) => g.name === repo.name);
        return gr?.data || emptyRepoData();
      });
      reposEl.innerHTML = repos.map((repo, i) => repoCard(repo, data[i])).join('');
    }

    function renderCommitList(repo, commits, route) {
      if (!commits.length) {
        return '<div class="detail-empty muted">No commits found.</div>';
      }
      return `
        <div class="repo-commit-list">
          ${commits.map((commit) => {
            const href = repoCommitHref(repo, {
              branch: route?.branch || null,
              tag: route?.tag || null,
              commit: commit.oid,
            });
            const decorations = commit.decorations?.length ? ` <span class="muted small">(${escapeHtml(commit.decorations.join(', '))})</span>` : '';
            return `
              <a class="repo-commit-item" href="${href}">
                <div class="repo-commit-top">
                  <div class="mono">${escapeHtml(commit.oid.slice(0, 12))}</div>
                  <span class="muted small">View commit</span>
                </div>
                <div class="repo-commit-summary">${escapeHtml(commit.summary)}</div>
                ${decorations}
                <div class="repo-commit-meta">${escapeHtml(commit.author)} · ${escapeHtml(commit.date)}</div>
              </a>
            `;
          }).join('')}
        </div>`;
    }

    function renderRecentCommits(repo, commits, route, forceOpen = false) {
      const body = renderCommitList(repo, commits, route);
      if (commits.length <= 5) {
        return body;
      }
      return `
        <details class="small"${forceOpen ? ' open' : ''}>
          <summary style="cursor:pointer;">Recent commits (${commits.length})</summary>
          <div style="margin-top:10px;">${body}</div>
        </details>
      `;
    }

    function findCommitSummary(data, route) {
      if (!route?.commit) return null;
      const match = data.commits.find((commit) => commit.oid === route.commit || commit.oid.startsWith(route.commit));
      return match || null;
    }

    function renderCommitDetail(repo, data, route) {
      const healthState = getRepoHealth(repo.name);
      const healthClass = repoHealthClass(healthState);
      const selectedCommit = findCommitSummary(data, route) || data.selectedCommit || data.latestCommit;
      const selectedSha = selectedCommit?.oid || route.commit || data.resolvedRef || data.selectedRef || data.ref || 'n/a';
      const commitDiff = Array.isArray(data.commitDiff) ? data.commitDiff : [];
      const listRoute = {
        branch: route.branch || '',
        tag: route.tag || '',
      };
      const parentList = (selectedCommit?.parents || []).map((parent) => `<span class="pill mono">${escapeHtml(parent.slice(0, 12))}</span>`).join(' ') || '<span class="muted">No parent data</span>';
      const diffList = commitDiff.length
        ? commitDiff.map((entry) => `
          <details class="repo-diff-file">
            <summary style="cursor:pointer;">
              <span class="repo-commit-top">
                <span class="repo-commit-summary">${entry.status === 'added' ? '+' : entry.status === 'deleted' ? '−' : '±'} ${escapeHtml(entry.path)}</span>
                <span class="muted small">${escapeHtml(entry.status)}</span>
              </span>
            </summary>
            <pre class="repo-diff-body">${escapeHtml(entry.patch.join('\n'))}</pre>
          </details>
        `).join('')
        : '<div class="detail-empty muted">No file changes found.</div>';
      return `
        <div class="repo-page">
          <div class="repo-hero">
            <div class="repo-breadcrumbs">
              <a href="./">repos</a>
              <span>/</span>
              <a href="${repoSelectionHref(repo, route)}">${escapeHtml(repo.name)}</a>
              <span>/</span>
              <span class="mono">${escapeHtml(selectedSha.slice(0, 12))}</span>
            </div>
            <div class="repo-title-row">
              <div class="repo-title">
                <div class="repo-meta">
                  <h2>${escapeHtml(selectedSha.slice(0, 12))}</h2>
                  <span class="health-badge ${healthClass}"><span class="health-dot"></span></span>
                </div>
                <div class="small muted">${escapeHtml(selectedCommit?.summary || 'Selected commit')}</div>
                <div class="repo-meta">
                  <span class="pill">Author: ${escapeHtml(selectedCommit?.author || 'n/a')}</span>
                  <span class="pill">Date: ${escapeHtml(selectedCommit?.date || 'n/a')}</span>
                </div>
              </div>
              <div class="actions">
                <a class="button" href="${repoCommitsHref(repo, route)}">Back to commits</a>
                <a class="button" href="${repoSelectionHref(repo, route)}">Back to code</a>
                <a class="button" href="${repo.url.replace(/\/$/, '')}/commit/${encodeURIComponent(selectedSha)}" target="_blank" rel="noreferrer noopener">Open upstream</a>
              </div>
            </div>
            <div class="repo-tabs" role="tablist" aria-label="Repository sections">
              <a class="repo-tab" href="${repoSelectionHref(repo, route)}">Code</a>
              <a class="repo-tab" href="${repoCommitsHref(repo, route)}">Commits</a>
              <a class="repo-tab active" href="${repoCommitHref(repo, route)}">Commit</a>
            </div>
          </div>

          <div class="repo-layout">
            <div class="repo-main">
              <div class="repo-sidebar-card">
                <div class="row" style="justify-content:space-between; align-items:center;">
                  <h3 style="margin:0;">Commit message</h3>
                  <span class="muted small mono">${escapeHtml(selectedSha.slice(0, 12))}</span>
                </div>
                <div style="margin-top:10px; white-space:pre-wrap;">${escapeHtml(selectedCommit?.message || 'n/a')}</div>
              </div>
              <div class="repo-sidebar-card" style="margin-top:14px;">
                <div class="row" style="justify-content:space-between; align-items:center;">
                  <h3 style="margin:0;">Commit diff</h3>
                  <span class="muted small">${commitDiff.length} changed</span>
                </div>
                <div style="margin-top:10px;">${diffList}</div>
              </div>
              <div class="repo-sidebar-card" style="margin-top:14px;">
                <details>
                  <summary style="cursor:pointer;">
                    <span class="row" style="justify-content:space-between; align-items:center; width:100%;">
                      <span class="muted small">Files at commit · ${data.files.length} entries</span>
                    </span>
                  </summary>
                  <div style="margin-top:10px;">${renderFileList(repo, data.files, route)}</div>
                </details>
              </div>
            </div>
            <aside class="repo-sidebar">
              <div class="repo-sidebar-card">
                <div class="muted small">Parents</div>
                <div class="row" style="margin-top:8px; gap:6px; flex-wrap:wrap;">${parentList}</div>
              </div>
              <div class="repo-sidebar-card">
                <div class="muted small">Browse at commit</div>
                <div style="margin-top:10px;">
                  <a class="button" href="${repoBrowseAtCommitHref(repo, { branch: route.branch || null, tag: route.tag || null, commit: selectedSha })}">Open code view</a>
                </div>
              </div>
              <div class="repo-sidebar-card">
                <div class="muted small">Recent commits</div>
                <div style="margin-top:10px;">${renderRecentCommits(repo, data.commits, listRoute)}</div>
              </div>
            </aside>
          </div>
        </div>
      `;
    }

    function renderFileList(repo, files, route) {
      if (!files.length) {
        return '<div class="repo-files-empty muted">No files found for this ref.</div>';
      }
      const renderPath = (file) => {
        const parts = file.split('/').filter(Boolean);
        return `<div class="repo-files-path"><span class="repo-files-icon">📄</span>${parts.map((part, index) => {
          const isLast = index === parts.length - 1;
          const href = isLast
            ? repoFileHref(repo, {
              branch: route?.branch || null,
              tag: route?.tag || null,
              commit: route?.commit || null,
              path: file,
            })
            : repoSelectionHref(repo, {
              branch: route?.branch || null,
              tag: route?.tag || null,
              path: parts.slice(0, index + 1).join('/'),
            });
          const segment = `<a class="repo-files-path-link${isLast ? ' final' : ''}" href="${href}">${escapeHtml(part)}</a>`;
          return isLast ? segment : `${segment}<span class="repo-files-path-separator">/</span>`;
        }).join('')}</div>`;
      };
      return `
        <div class="repo-files">
        <div class="repo-files-header">
          <div>Path</div>
          <div>Type</div>
        </div>
        ${files.map((file) => {
          const parts = file.split('/');
          const name = parts[parts.length - 1] || file;
          const ext = name.includes('.') ? name.split('.').pop() : 'file';
          return `
            <div class="repo-files-row mono">
              <div>${renderPath(file)}</div>
              <div>${escapeHtml(ext)}</div>
            </div>
          `;
        }).join('')}
        </div>
      `;
    }

    function renderRepoDetail(repo, data, route) {
      const branchSelected = route.branch
        ? route.branch
        : (route.tag ? (data.branchForSelection || '') : (data.branches.includes(data.selectedRef) ? data.selectedRef : ''));
      const tagSelected = route.tag && data.tags.includes(route.tag) ? route.tag : (data.tags.includes(data.selectedRef) ? data.selectedRef : '');
      const currentRef = escapeHtml(data.resolvedRef || data.selectedRef || data.ref || 'n/a');
      const healthState = getRepoHealth(repo.name);
      const healthClass = repoHealthClass(healthState);
      const currentCommit = data.latestCommit || null;
      const commitCount = data.commits.length;
      const selectedView = route.view === 'commits' ? 'commits' : 'code';
      const displayedFiles = route.path ? data.files.filter((file) => file === route.path || file.startsWith(`${route.path.replace(/\/+$/, '')}/`)) : data.files;
      return `
        <div class="repo-page">
          <div class="repo-hero">
            <div class="repo-breadcrumbs">
              <a href="./">repos</a>
              <span>/</span>
              <span class="mono">${escapeHtml(repo.name)}</span>
            </div>
            <div class="repo-title-row">
              <div class="repo-title">
                <div class="repo-meta">
                  <h2>${escapeHtml(repo.name)}</h2>
                  <span class="health-badge ${healthClass}"><span class="health-dot"></span></span>
                </div>
                <div class="small muted"><a href="${repo.url}" target="_blank" rel="noreferrer noopener">${repo.url}</a></div>
                <div class="repo-meta">
                  <span class="pill">Ref: <span class="mono">${currentRef}</span></span>
                  <span class="pill">Files: ${data.files.length}</span>
                  <span class="pill">Commits: ${commitCount}</span>
                  <span class="pill" style="opacity:.8;">${escapeHtml(repoState.get(repo.name) || 'idle')}</span>
                </div>
              </div>
              <div class="actions">
                <button type="button" data-refresh-repo="${repo.name}" ${refreshingRepos.has(repo.name) ? 'disabled' : ''}>${refreshingRepos.has(repo.name) ? 'Refreshing...' : 'Refresh'}</button>
                <a class="button" href="./">Back to repos</a>
                <a class="button" href="${repo.url}" target="_blank" rel="noreferrer noopener">Open upstream</a>
              </div>
            </div>
            <div class="repo-tabs" role="tablist" aria-label="Repository sections">
              <a class="repo-tab${selectedView === 'code' ? ' active' : ''}" href="${repoSelectionHref(repo, route)}">Code</a>
              <a class="repo-tab${selectedView === 'commits' ? ' active' : ''}" href="${repoCommitsHref(repo, route)}">Commits</a>
            </div>
          </div>

          ${data.branches.length === 0 && data.tags.length === 0 ? `
            <div class="repo-toolbar" style="background:#3a1f1f;color:#ff9999;padding:8px 12px;border-radius:6px;">
              <span class="small">No branches or tags found — local clone may be empty. Click Refresh to re-fetch.</span>
            </div>
          ` : ''}
          <div class="repo-toolbar">
            <select class="repo-select" data-branch-select="${repo.name}">
              ${buildSelectOptions(data.branches, branchSelected, 'Switch branch')}
            </select>
            <select class="repo-select" data-tag-select="${repo.name}">
              ${buildSelectOptions(data.tags, tagSelected, 'Switch tag')}
            </select>
            <div class="spacer"></div>
            ${currentCommit ? `
              <div class="muted small">Latest commit <span class="mono">${escapeHtml(currentCommit.oid ? currentCommit.oid.slice(0, 12) : 'n/a')}</span></div>
            ` : ''}
          </div>

          <div class="repo-layout">
            <div class="repo-main">
              ${selectedView === 'commits' ? `
                <div class="repo-sidebar-card">
                  <div class="row" style="justify-content:space-between; align-items:center;">
                    <h3 style="margin:0;">Commits</h3>
                    <span class="muted small">${commitCount} loaded</span>
                  </div>
                  <div style="margin-top:10px;">${renderRecentCommits(repo, data.commits, route, true)}</div>
                </div>
              ` : `
                <div class="repo-sidebar-card">
                  <div class="row" style="justify-content:space-between; align-items:center;">
                    <h3 style="margin:0;">Files</h3>
                    <span class="muted small">${displayedFiles.length} entries</span>
                  </div>
                  <div style="margin-top:10px;">${renderFileList(repo, displayedFiles, route)}</div>
                </div>
              `}
              <div class="repo-sidebar-card repo-bumper" aria-hidden="true"></div>
            </div>
            <aside class="repo-sidebar">
              <div class="repo-sidebar-card">
                <div class="muted small">About</div>
                <div style="margin-top:8px;">Static browser clone of <span class="mono">${escapeHtml(repo.name)}</span>.</div>
                <div class="small muted" style="margin-top:10px;">Commit: <span class="mono">${escapeHtml(currentCommit?.oid ? currentCommit.oid.slice(0, 12) : 'n/a')}</span></div>
                <div class="small muted" style="margin-top:4px;">Author: ${escapeHtml(currentCommit?.author || 'n/a')}</div>
                <div class="small muted" style="margin-top:4px;">Date: ${escapeHtml(currentCommit?.date || 'n/a')}</div>
              </div>
              <div class="repo-sidebar-card">
                <div class="muted small">Stats</div>
                <div class="small" style="margin-top:8px;"><span class="muted">Branches:</span> ${data.branches.length}</div>
                <div class="small"><span class="muted">Tags:</span> ${data.tags.length}</div>
                <div class="small"><span class="muted">Selected ref:</span> <span class="mono">${escapeHtml(data.selectedRef || 'n/a')}</span></div>
              </div>
              <div class="repo-sidebar-card">
                <div class="muted small">Recent commits</div>
                <div style="margin-top:10px;">${renderRecentCommits(repo, data.commits, route)}</div>
              </div>
              <div class="repo-sidebar-card repo-bumper" aria-hidden="true"></div>
            </aside>
          </div>
        </div>
      `;
    }

    function renderRepoNotFound(route) {
      const repoName = route.repoName || 'unknown';
      const repoList = repos.map((repo) => `<li class="list-item"><a href="${repoSelectionHref(repo)}">${escapeHtml(repo.name)}</a></li>`).join('');
      reposEl.innerHTML = `
        <div class="detail-shell">
          <div class="row" style="justify-content:space-between; align-items:flex-start;">
            <div>
              <div class="muted small">Repository not found</div>
              <h2 style="margin:4px 0 0;">${escapeHtml(repoName)}</h2>
            </div>
            <div class="actions">
              <a class="button" href="./">Back to all repos</a>
            </div>
          </div>
          <div class="detail-empty" style="margin-top:12px;">
            The requested repository is not in this viewer.
          </div>
        </div>
        <div class="detail-shell" style="margin-top:14px;">
          <h3 style="margin-top:0;">Available repositories</h3>
          <ul class="list">${repoList}</ul>
        </div>
      `;
    }

    function renderApp(results = null) {
      const route = getRouteContext(repos);
      footer.log('git', `renderApp repo=${route.repoName || 'none'} view=${route.view || 'list'}`, 'debug');
      if (repoPanel) repoPanel.style.display = route.repo ? 'none' : '';
      if (route.repo) {
        const gr = gitRepos.find((g) => g.name === route.repo.name);
        const data = results && !Array.isArray(results) ? results : (gr?.data || emptyRepoData());
        reposEl.className = '';
        reposEl.innerHTML = route.view === 'commit'
          ? renderCommitDetail(route.repo, data, route)
          : renderRepoDetail(route.repo, data, route);
      } else if (route.repoName) {
        reposEl.className = '';
        renderRepoNotFound(route);
      } else {
        reposEl.className = 'grid';
        renderRepoList(Array.isArray(results) ? results : null);
      }

      reposEl.querySelectorAll('[data-refresh-repo]').forEach((button) => {
        button.addEventListener('click', () => {
          void refreshOneRepo(button.getAttribute('data-refresh-repo'), { fetchAll: true });
        });
      });
      reposEl.querySelectorAll('[data-view-repo]').forEach((button) => {
        button.addEventListener('click', async () => {
          const repoName = button.getAttribute('data-view-repo');
          const repo = repos.find((entry) => entry.name === repoName);
          if (!repo) return;
          const branchSelect = reposEl.querySelector(`[data-branch-select="${repo.name}"]`);
          const tagSelect = reposEl.querySelector(`[data-tag-select="${repo.name}"]`);
          const nextRoute = {
            repo,
            repoName: repo.name,
            branch: branchSelect && branchSelect.value ? branchSelect.value : null,
            tag: tagSelect && tagSelect.value ? tagSelect.value : null,
            path: route.path || '',
          };
          window.history.pushState({}, '', repoSelectionHref(repo, nextRoute));
          await refreshDetail(nextRoute);
        });
      });
      reposEl.querySelectorAll('[data-view-commits]').forEach((button) => {
        button.addEventListener('click', async () => {
          const repoName = button.getAttribute('data-view-commits');
          const repo = repos.find((entry) => entry.name === repoName);
          if (!repo) return;
          const branchSelect = reposEl.querySelector(`[data-branch-select="${repo.name}"]`);
          const tagSelect = reposEl.querySelector(`[data-tag-select="${repo.name}"]`);
          const nextRoute = {
            repo,
            repoName: repo.name,
            view: 'commits',
            branch: branchSelect && branchSelect.value ? branchSelect.value : null,
            tag: tagSelect && tagSelect.value ? tagSelect.value : null,
            path: route.path || '',
          };
          window.history.pushState({}, '', repoCommitsHref(repo, nextRoute));
          await refreshDetail(nextRoute);
        });
      });
      reposEl.querySelectorAll('[data-branch-select], [data-tag-select]').forEach((select) => {
        select.addEventListener('change', async () => {
          const repoName = select.getAttribute('data-branch-select') || select.getAttribute('data-tag-select');
          const repo = repos.find((entry) => entry.name === repoName);
          if (!repo) return;
          const isBranchSelect = !!select.getAttribute('data-branch-select');
          const nextRoute = {
            repo,
            repoName: repo.name,
            view: route.view || '',
            branch: isBranchSelect && select.value ? select.value : null,
            tag: !isBranchSelect && select.value ? select.value : null,
            path: route.path || '',
          };
          window.history.replaceState({}, '', route.view === 'commits' ? repoCommitsHref(repo, nextRoute) : repoSelectionHref(repo, nextRoute));
          await refreshDetail(nextRoute);
        });
      });
    }

    /**
     * Process 6 (manual): Single Repo Refresh
     * Trigger: User clicks per-card refresh button (data-refresh-repo)
     * Network: Yes — forces fetchAll refs for one repo
     * Scope: One repo only
     */
    async function refreshOneRepo(repoName, { force = false, skipNetwork = false, fetchAll = false } = {}) {
      const repo = repos.find((entry) => entry.name === repoName);
      if (!repo) return;
      const route = getRouteContext(repos).repo?.name === repo.name ? getRouteContext(repos) : null;
      footer.log('git', `refreshOneRepo start ${repo.name} force=${force} fetchAll=${fetchAll} skipNetwork=${skipNetwork} route=${route ? 'yes' : 'no'}`, 'debug');
      refreshingRepos.add(repo.name);
      try {
        setRepoStatus(repo.name, 'refreshing...');
        if (route) {
          setRepoHealth(repo.name, 'checking');
          renderApp();
        }
        setRepoPing(repo.name, null);
        if (force) {
          footer.log('git', `${repo.name} force=true → wiping local clone`, 'info');
          await wipeRepo(repo);
        }
        const probeStart = performance.now();
        const probe = route ? probeRemoteHost(repo).catch(() => ({ ok: false, durationMs: null })) : null;
        await ensureRepo(repo, route, { skipP2P: force, fetchAll });
        footer.log('git', `refreshOneRepo ensure done ${repo.name} proxy=${activeProxy || 'none'}`, 'debug');
        const data = await readRepo(repo, route, { skipNetwork });
        const gitRepo = gitRepos.find((gr) => gr.name === repo.name);
        if (gitRepo) {
          gitRepo.data = data;
          gitRepo.saveCache();
        }
        footer.log('git', `refreshOneRepo read done ${repo.name} tags=${data.tags.length}`, 'debug');
        if (route) {
          const probeOk = await probe;
          const probeMs = probeOk?.durationMs ?? null;
          setRepoPing(repo.name, probeMs);
          const gitOk = data && data.commits && data.commits.length > 0;
          setRepoHealth(repo.name, gitOk ? 'available' : 'unavailable');
          footer.log('git', `probe ${repo.name} ${probeOk?.ok ? 'ok' : 'fail'} ping=${probeMs ?? 'n/a'} ms gitOk=${gitOk}`, 'debug');
        }
        renderApp(repos.map((entry) => {
          const gr = gitRepos.find((g) => g.name === entry.name);
          return entry.name === repo.name ? data : (gr?.data || emptyRepoData());
        }));
        setRepoStatus(repo.name, 'ready');
        footer.log('git', `refreshOneRepo complete ${repo.name}`, 'debug');
      } catch (e) {
        if (route) setRepoHealth(repo.name, 'unavailable');
        setRepoPing(repo.name, null);
        setRepoStatus(repo.name, `refresh failed: ${e.message}`);
        footer.log('git', `refreshOneRepo catch ${repo.name}: ${e.message}`, 'error', 'unavailable');
        footer.log('git', `stack: ${e.stack || 'no stack'}`, 'trace');
      } finally {
        refreshingRepos.delete(repo.name);
        if (route) renderApp();
      }
    }

    /**
     * Processes 3 & 4: List Refresh (cache-only + background network)
     * Trigger: refresh({ skipNetwork }) on boot, or manual "Refresh repos" button
     * Network: Depends on skipNetwork flag. When false, hits CORS proxy for all repos.
     * Scope: All repos — 3 concurrent workers (CONCURRENCY = 3) process the full list.
     * Note: This runs unconditionally even when user is on a detail view of one repo.
     */
    async function refreshList({ force = false, skipNetwork = false, fetchAll = false } = {}) {
      try {
        const route = getRouteContext(repos);
        const hasCachedData = gitRepos.some((gr) => gr.hasCachedCommits || gr.hasCachedRefs);
        // Show green immediately when cached data exists; background refresh updates cards.
        setStatus(hasCachedData ? 'ready (refreshing)' : 'loading repos...', hasCachedData ? 'available' : 'checking');
        footer.log('git', `refreshing ${repos.length} repos force=${force} fetchAll=${fetchAll} skipNetwork=${skipNetwork}`, 'debug');
        repos.forEach((repo) => {
          setRepoStatus(repo.name, 'refreshing...');
          setRepoHealth(repo.name, 'checking');
          footer.log('git', `checking ${repo.name}`, 'debug');
        });
        renderApp();
        const orderedRepos = route.repo
          ? [route.repo, ...repos.filter((repo) => repo.name !== route.repo.name)]
          : [...repos];
        const dataByRepo = new Map();

        // Process repos concurrently so the list status turns green quickly.
        const CONCURRENCY = 3;
        const queue = orderedRepos.slice();
        async function worker() {
          while (queue.length) {
            const repo = queue.shift();
            const repoRoute = route.repo && repo.name === route.repo.name ? route : null;
            try {
              if (force) {
                footer.log('git', `${repo.name} force=true → wiping local clone`, 'info');
                await wipeRepo(repo);
              }
              setRepoPing(repo.name, null);
              const probe = probeRemoteHost(repo).catch(() => ({ ok: false, durationMs: null }));
              await ensureRepo(repo, repoRoute, { skipP2P: force, fetchAll });
              const data = await readRepo(repo, repoRoute, { skipNetwork });
              const probeOk = await probe;
              const probeMs = probeOk?.durationMs ?? null;
              setRepoPing(repo.name, probeMs);
              const gitOk = data && data.commits && data.commits.length > 0;
              setRepoHealth(repo.name, gitOk ? 'available' : 'unavailable');
              setRepoStatus(repo.name, 'ready');
              footer.log('git', `ready ${repo.name} tags=${data.tags.length}`, 'info', 'available');
              dataByRepo.set(repo.name, data);
              const gitRepo = gitRepos.find((gr) => gr.name === repo.name);
              if (gitRepo) {
                gitRepo.data = data;
                gitRepo.saveCache();
              }
              // Incrementally update the list view and status as each repo finishes.
              if (dataByRepo.size > 0) {
                setStatus(`${dataByRepo.size}/${repos.length} repos ready`, 'available');
              }
              if (!route.repo) {
                const incrementalValues = repos.map((r) => {
                  const gr = gitRepos.find((g) => g.name === r.name);
                  return dataByRepo.get(r.name) || gr?.data || emptyRepoData();
                });
                renderApp(incrementalValues);
              }
              if (repoRoute) {
                renderApp(data);
              }
            } catch (e) {
              footer.log('git', `refreshList worker catch ${repo.name}: ${e.message}`, 'error', 'unavailable');
              footer.log('git', `stack: ${e.stack || 'no stack'}`, 'trace');
              setRepoStatus(repo.name, `refresh failed: ${e.message}`);
              setRepoHealth(repo.name, 'unavailable');
              setRepoPing(repo.name, null);
            }
          }
        }
        await Promise.all(Array.from({ length: CONCURRENCY }, () => worker()));

        // Reload from localStorage so merged tags/branches/serverRefs are reflected.
        gitRepos.forEach((gr) => gr.loadCache());

        const values = repos.map((repo) => {
          const gr = gitRepos.find((g) => g.name === repo.name);
          return dataByRepo.get(repo.name) || gr?.data || emptyRepoData();
        });
        renderApp(values);
        const readyCount = dataByRepo.size;
        const statusSummary = repos.map((repo) => {
          const health = getRepoHealth(repo.name);
          const ping = getRepoPing(repo.name);
          return `${repo.name}:${health}${ping ? `(${ping}ms)` : ''}`;
        }).join(', ');
        footer.log('git', `status: ${statusSummary}`, 'info', readyCount > 0 ? 'available' : 'unavailable');
        setStatus(readyCount === repos.length ? 'ready' : `partial: ${readyCount}/${repos.length} repos ready`, readyCount > 0 ? 'available' : 'checking');
      } catch (e) {
        setStatus(`unavailable: ${e.message}`, 'unavailable');
        footer.log('git', `refreshList top-level catch: ${e.message}`, 'error', 'unavailable');
        footer.log('git', `stack: ${e.stack || 'no stack'}`, 'trace');
      }
    }

    /**
     * Process 5: Detail Refresh
     * Trigger: Route change to ?repo=foo&view=... or detail page load
     * Network: Yes — calls ensureRepo + readRepo for the single visible repo
     * Scope: One repo only
     */
    async function refreshDetail(route, { skipNetwork = false } = {}) {
      if (!route.repo) {
        renderApp();
        return;
      }
      footer.log('git', `refreshDetail start ${route.repo.name} skipNetwork=${skipNetwork} view=${route.view || 'code'} branch=${route.branch || ''} tag=${route.tag || ''} commit=${route.commit || ''}`, 'debug');
      try {
        setStatus(`loading ${route.repo.name}...`, 'checking');
        setRepoHealth(route.repo.name, 'checking');
        renderApp();
        const probe = probeRemoteHost(route.repo).catch(() => ({ ok: false, durationMs: null }));
        await ensureRepo(route.repo, route, { fetchAll: !skipNetwork });
        footer.log('git', `refreshDetail ensure done ${route.repo.name}`, 'debug');
        const data = await readRepo(route.repo, route, { skipNetwork });
        const gitRepo = gitRepos.find((gr) => gr.name === route.repo.name);
        if (gitRepo) {
          gitRepo.data = data;
          gitRepo.saveCache();
        }
        footer.log('git', `refreshDetail read done ${route.repo.name} tags=${data.tags.length}`, 'debug');
        const available = await probe;
        const probeMs = available?.durationMs ?? null;
        setRepoPing(route.repo.name, probeMs);
        const gitOk = data && data.commits && data.commits.length > 0;
        setRepoHealth(route.repo.name, gitOk ? 'available' : 'unavailable');
        renderApp(data);
        setStatus('ready', 'available');
        footer.log('git', `ready ${route.repo.name}`, 'info', 'available');
        footer.log('git', `refreshDetail complete ${route.repo.name} available=${available?.ok} ping=${probeMs ?? 'n/a'} ms`, 'debug');
      } catch (e) {
        setRepoHealth(route.repo.name, 'unavailable');
        setStatus(`unavailable: ${e.message}`, 'unavailable');
        footer.log('git', `viewer failed: ${e.message}`, 'error', 'unavailable');
      }
    }

    /**
     * Refresh dispatcher — routes to refreshDetail or refreshList based on current URL.
     * Trigger: Boot sequence (twice: skipNetwork=true immediate, skipNetwork=false after 3s)
     *          and manual refresh button clicks.
     */
    async function refresh({ skipNetwork = false } = {}) {
      const route = getRouteContext(repos);
      footer.log('git', `refresh dispatch repo=${route.repoName || 'none'} view=${route.view || 'list'} skipNetwork=${skipNetwork}`, 'debug');
      if (route.repo) {
        await refreshDetail(route, { skipNetwork });
      } else if (route.repoName) {
        renderApp();
        setStatus(`unknown repo: ${route.repoName}`, 'unavailable');
      } else {
        await refreshList({ skipNetwork });
      }
    }

    refreshBtn.addEventListener('click', () => {
      const route = getRouteContext(repos);
      if (route.repo) {
        void refreshOneRepo(route.repo.name, { fetchAll: true });
      } else {
        void refreshList({ fetchAll: true });
      }
    });
    // Process 2: Immediate Cache Render — synchronous, no network.
    const cachedValues = repos.map((repo) => {
      const gr = gitRepos.find((g) => g.name === repo.name);
      return gr?.data || emptyRepoData();
    });
    renderApp(cachedValues);
    // Process 3: First refresh from local clone + cache only (no network).
    void refresh({ skipNetwork: true });
    // Process 4: Background network refresh after 3s delay.
    // refresh() routes to refreshDetail (single repo) when on a detail view,
    // or refreshList (all repos) when on the list view.
    setTimeout(() => refresh({ skipNetwork: false }), 3000);
  </script>
</body>
