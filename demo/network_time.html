<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Network Time — nostr-dag</title>
  <link rel="icon" href="./shared/favicon.ico" />
  <link rel="stylesheet" href="./shared/page.css" />
  <style>
    :root {
      --ok: #2e7d32;
      --warn: #f9a825;
      --error: #c62828;
      --info: #1565c0;
      --bg: #ffffff;
      --fg: #111111;
      --muted: #666666;
      --border: #e0e0e0;
      --panel: #f5f5f5;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d0d0d;
        --fg: #e0e0e0;
        --muted: #999999;
        --border: #333333;
        --panel: #1a1a1a;
      }
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--fg);
      margin: 0;
      padding: 8px;
      line-height: 1.2;
      font-size: 0.85rem;
    }
    h1 { font-size: 1.1rem; margin: 0; display: inline; }
    .subtitle { color: var(--muted); font-size: 0.75rem; display: inline; margin-left: 6px; }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      max-width: 900px;
      margin: 0 auto;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 8px 10px;
    }
    .panel h2 { font-size: 0.85rem; margin: 0 0 4px; }
    .stats {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 14px;
      margin-top: 4px;
    }
    .stat { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
    .status { font-weight: 600; }
    .status.ok { color: var(--ok); }
    .status.warn { color: var(--warn); }
    .status.error { color: var(--error); }
    .mono { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 0.8rem; }
    .muted { color: var(--muted); font-size: 0.8rem; }
    button {
      background: var(--info);
      color: #fff;
      border: none;
      border-radius: 3px;
      padding: 3px 8px;
      font-size: 0.8rem;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    #log {
      height: 90px;
      overflow-y: auto;
      font-family: ui-monospace, SFMono-Regular, monospace;
      font-size: 0.7rem;
      white-space: pre-wrap;
      word-break: break-all;
      line-height: 1.3;
      margin-top: 4px;
    }
    .time-display {
      font-size: 1.1rem;
      font-weight: 700;
      font-family: ui-monospace, SFMono-Regular, monospace;
      padding: 4px 6px;
      border-radius: 4px;
      text-align: center;
      background: var(--bg);
      border: 1px solid var(--border);
    }
    .about { font-size: 0.75rem; color: var(--muted); margin-top: 2px; }
    .about a { color: var(--info); }
    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 6px;
      max-width: 900px;
      margin-left: auto;
      margin-right: auto;
    }
    @media (max-width: 600px) {
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="header-row">
    <div>
      <h1>Network Time</h1>
      <span class="subtitle">P2P consensus clock</span>
    </div>
    <a href="./index.html" style="text-decoration:none;font-size:1.2rem;">⬅</a>
  </div>

  <div class="grid">
    <div class="panel">
      <h2>Consensus Clock</h2>
      <div id="timeDisplay" class="time-display status-checking">syncing…</div>
      <div class="stats">
        <span class="stat"><span class="muted">Offset:</span> <span id="offsetDisplay" class="mono">—</span></span>
        <span class="stat"><span class="muted">Samples:</span> <span id="sampleDisplay">0</span></span>
        <span class="stat"><span class="muted">Status:</span> <span id="statusDisplay" class="status">checking</span></span>
        <button id="syncBtn" type="button">Force Sync</button>
      </div>
    </div>

    <div class="panel">
      <h2>P2P Node</h2>
      <div class="stats">
        <span class="stat"><span class="muted">Peer ID:</span> <span id="peerIdDisplay" class="mono">—</span></span>
        <span class="stat"><span class="muted">Status:</span> <span id="nodeStatusDisplay" class="status">off</span></span>
        <span class="stat"><span class="muted">Connected:</span> <span id="connectedDisplay">0</span></span>
        <span class="stat"><span class="muted">Bootstrap:</span> <span id="bootstrapDisplay">0</span></span>
        <button id="startNodeBtn" type="button">Start Node</button>
      </div>
    </div>

    <div class="panel" style="grid-column: 1 / -1;">
      <h2>Log</h2>
      <div id="log">Waiting for sync…</div>
    </div>
  </div>

  <script type="module">
    import { initSharedNetworkTime } from './shared/network-time.mjs';
    import { createSharedLibp2pStack, DEFAULT_BOOTSTRAP_PEERS } from './shared/libp2p-stack.mjs';

    const timeDisplay = document.getElementById('timeDisplay');
    const offsetDisplay = document.getElementById('offsetDisplay');
    const sampleDisplay = document.getElementById('sampleDisplay');
    const statusDisplay = document.getElementById('statusDisplay');
    const syncBtn = document.getElementById('syncBtn');
    const peerIdDisplay = document.getElementById('peerIdDisplay');
    const nodeStatusDisplay = document.getElementById('nodeStatusDisplay');
    const connectedDisplay = document.getElementById('connectedDisplay');
    const bootstrapDisplay = document.getElementById('bootstrapDisplay');
    const startNodeBtn = document.getElementById('startNodeBtn');
    const logEl = document.getElementById('log');
    const logs = [];

    const connectedPeers = new Set();
    let nodeStarted = false;

    function log(text) {
      logs.push(`[${new Date().toLocaleTimeString()}] ${text}`);
      logEl.textContent = logs.slice(-40).join('\n');
    }

    function postLogger(label, text, level = 'info', state = 'checking') {
      try {
        fetch('/logger', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            time: new Date().toISOString(),
            label,
            text,
            level,
            state,
            source: '/network_time.html',
          }),
        }).catch(() => {});
      } catch {
        // best effort
      }
    }

    function updateDisplay(state) {
      const consensusTime = Date.now() + (state.offsetMs || 0);
      timeDisplay.textContent = new Date(consensusTime).toISOString().replace('T', ' ').replace('Z', ' UTC');
      timeDisplay.className = `time-display status-${state.status}`;
      offsetDisplay.textContent = `${state.offsetMs > 0 ? '+' : ''}${state.offsetMs} ms`;
      sampleDisplay.textContent = String(state.lastSampleCount || 0);
      statusDisplay.textContent = state.status;
      statusDisplay.className = `status status-${state.status}`;
    }

    function updateNodeDisplay() {
      peerIdDisplay.textContent = globalThis.__currentLibp2pPeerId || '—';
      nodeStatusDisplay.textContent = nodeStarted ? 'started' : 'off';
      nodeStatusDisplay.className = `status ${nodeStarted ? 'ok' : ''}`;
      connectedDisplay.textContent = String(connectedPeers.size);
      bootstrapDisplay.textContent = String(DEFAULT_BOOTSTRAP_PEERS.length);
    }

    let networkTime = null;
    const headerApi = {
      setNetworkTime({ text, title, state }) {
        const snapshot = networkTime?.getSnapshot?.() || { offsetMs: 0, status: 'checking', lastSampleCount: 0, lastAccuracyMs: null };
        updateDisplay(snapshot);
        log(text);
      },
    };

    networkTime = initSharedNetworkTime({ headerApi });

    function refresh() {
      const state = networkTime.getSnapshot();
      updateDisplay(state);
    }
    refresh();
    setInterval(refresh, 1000);

    syncBtn.addEventListener('click', () => {
      syncBtn.disabled = true;
      log('Manual sync requested…');
      networkTime.syncNow().then(() => {
        refresh();
        syncBtn.disabled = false;
        log('Manual sync complete');
      }).catch((e) => {
        syncBtn.disabled = false;
        log(`Sync failed: ${e.message}`);
      });
    });

    async function initLibp2pNode() {
      if (nodeStarted) return;
      startNodeBtn.disabled = true;
      log('Bootstrapping libp2p node…');
      try {
        const { node, bootstrapPeers } = await createSharedLibp2pStack({
          bootstrapPeers: DEFAULT_BOOTSTRAP_PEERS,
          onLog(level, text, state) {
            log(`[libp2p] ${text}`);
          },
          onStatus(state, peerId) {
            log(`[libp2p] ${state} ${peerId}`);
          },
        });

        node.addEventListener('peer:connect', (event) => {
          const peerId = event?.detail?.peerId?.toString?.() || event?.detail?.remotePeer?.toString?.() || 'unknown';
          connectedPeers.add(peerId);
          updateNodeDisplay();
          log(`Peer connected: ${peerId}`);
          postLogger('network-time', `Peer connected: ${peerId}`, 'info', 'available');
        });

        node.addEventListener('peer:disconnect', (event) => {
          const peerId = event?.detail?.peerId?.toString?.() || event?.detail?.remotePeer?.toString?.() || 'unknown';
          connectedPeers.delete(peerId);
          updateNodeDisplay();
          log(`Peer disconnected: ${peerId}`);
          postLogger('network-time', `Peer disconnected: ${peerId}`, 'warn', 'checking');
        });

        networkTime.attachNode(node);
        nodeStarted = true;
        updateNodeDisplay();
        log(`Node started: ${node.peerId.toString()}`);
        postLogger('network-time', `Node started: ${node.peerId.toString()}`, 'info', 'available');
        log(`Bootstrap peers: ${bootstrapPeers.length}`);
        postLogger('network-time', `Bootstrap peers: ${bootstrapPeers.length}`, 'debug', 'checking');
      } catch (e) {
        log(`Node bootstrap failed: ${e.message}`);
        startNodeBtn.disabled = false;
      }
    }

    startNodeBtn.addEventListener('click', () => {
      void initLibp2pNode();
    });

    void initLibp2pNode();
  </script>
</body>
</html>
