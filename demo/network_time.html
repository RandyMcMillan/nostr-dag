<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Network Time — nostr-dag</title>
  <link rel="icon" href="./shared/favicon.ico" />
  <link rel="stylesheet" href="./shared/page.css" />
  <style>
    :root {
      --ok: #2e7d32;
      --warn: #f9a825;
      --error: #c62828;
      --info: #1565c0;
      --bg: #ffffff;
      --fg: #111111;
      --muted: #666666;
      --border: #e0e0e0;
      --panel: #f5f5f5;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d0d0d;
        --fg: #e0e0e0;
        --muted: #999999;
        --border: #333333;
        --panel: #1a1a1a;
      }
    }
    html, body {
      height: 100vh;
      margin: 0;
      overflow: hidden;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--fg);
      padding: 6px 8px;
      line-height: 1.2;
      font-size: 0.8rem;
      display: flex;
      flex-direction: column;
    }
    h1 { font-size: 1rem; margin: 0; display: inline; }
    .subtitle { color: var(--muted); font-size: 0.7rem; display: inline; margin-left: 4px; }
    .wrap {
      max-width: 900px;
      margin: 0 auto;
      width: 100%;
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
      padding-bottom: 10px;
    }
    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 4px;
      flex-shrink: 0;
    }
    .panels {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      flex-shrink: 0;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 6px 8px;
    }
    .panel h2 { font-size: 0.8rem; margin: 0 0 3px; }
    .time-display-inline {
      font-size: 0.78rem;
      font-weight: 700;
      font-family: ui-monospace, SFMono-Regular, monospace;
      white-space: nowrap;
    }
    .clock-row {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-wrap: nowrap;
      font-size: 0.7rem;
      line-height: 1.25;
    }
    .clock-row > * {
      white-space: nowrap;
    }
    .stats {
      font-size: 0.7rem;
      line-height: 1.35;
      display: flex;
      flex-direction: column;
      gap: 1px;
    }
    .stats > span { white-space: nowrap; }
    .stats > span:not(:last-child)::after { content: none; }
    .peer-list {
      margin-top: 3px;
      font-size: 0.65rem;
      font-family: ui-monospace, SFMono-Regular, monospace;
      line-height: 1.3;
      max-height: 60px;
      overflow-y: auto;
    }
    .peer-list > div { white-space: nowrap; }
    .mono { font-family: ui-monospace, SFMono-Regular, monospace; }
    .muted { color: var(--muted); }
    .status { font-weight: 600; }
    .status.ok { color: var(--ok); }
    .status.warn { color: var(--warn); }
    .status.error { color: var(--error); }
    button {
      background: var(--info);
      color: #fff;
      border: none;
      border-radius: 3px;
      padding: 2px 6px;
      font-size: 0.75rem;
      cursor: pointer;
      margin-left: 4px;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .log-panel {
      margin-top: 4px;
      margin-bottom: 10px;
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
    }
    .log-panel h2 { font-size: 0.8rem; margin: 0 0 3px; flex-shrink: 0; }
    #log {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      font-family: ui-monospace, SFMono-Regular, monospace;
      font-size: 0.7rem;
      line-height: 1.3;
      white-space: pre-wrap;
      word-break: break-all;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 4px 6px;
    }
    @media (max-width: 600px) {
      .panels { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="header-row">
      <div>
        <h1>Network Time</h1>
        <span class="subtitle">P2P consensus clock</span>
      </div>
      <a href="./index.html" style="text-decoration:none;font-size:1.1rem;">⬅</a>
    </div>

    <div class="panels">
      <div class="panel">
        <div class="clock-row">
          <span id="timeDisplay" class="time-display-inline status-checking">syncing…</span>
          <span id="statusDisplay" class="status">checking</span>
        </div>
        <div class="clock-row">
          <span class="muted">Offset:</span> <span id="offsetDisplay" class="mono">—</span>
          <span class="muted">Samples:</span> <span id="sampleDisplay">0</span>
          <button id="syncBtn" type="button">Sync</button>
          <button id="resetBtn" type="button">Reset</button>
        </div>
        <div class="clock-row">
          <span class="muted">Topic:</span>
          <input id="topicInput" type="text" value="nostr-dag-bridge" style="font-family:ui-monospace,monospace;font-size:0.7rem;flex:1;min-width:120px;border:1px solid var(--border);border-radius:3px;padding:2px 4px;background:var(--bg);color:var(--fg);" />
          <button id="applyTopicBtn" type="button">Apply</button>
        </div>
      </div>

      <div class="panel">
        <h2>P2P Node</h2>
        <div class="stats">
          <span><span class="muted">Peer ID:</span> <span id="peerIdDisplay" class="mono">—</span></span>
          <span><span class="muted">Status:</span> <span id="nodeStatusDisplay" class="status">off</span></span>
          <span><span class="muted">Connected:</span> <span id="connectedDisplay">0</span></span>
          <span><span class="muted">Bootstrap:</span> <span id="bootstrapDisplay">0</span></span>
          <button id="startNodeBtn" type="button">Start</button>
        </div>
        <div id="peerList" class="peer-list"></div>
      </div>
    </div>

    <div class="log-panel">
      <h2>Log</h2>
      <div id="log">Waiting for sync…</div>
    </div>
  </div>

  <script type="module">
    import { initSharedNetworkTime } from './shared/network-time.mjs';
    import { createSharedLibp2pStack, DEFAULT_BOOTSTRAP_PEERS } from './shared/libp2p-stack.mjs';

    const timeDisplay = document.getElementById('timeDisplay');
    const offsetDisplay = document.getElementById('offsetDisplay');
    const sampleDisplay = document.getElementById('sampleDisplay');
    const statusDisplay = document.getElementById('statusDisplay');
    const syncBtn = document.getElementById('syncBtn');
    const peerIdDisplay = document.getElementById('peerIdDisplay');
    const nodeStatusDisplay = document.getElementById('nodeStatusDisplay');
    const connectedDisplay = document.getElementById('connectedDisplay');
    const bootstrapDisplay = document.getElementById('bootstrapDisplay');
    const startNodeBtn = document.getElementById('startNodeBtn');
    const logEl = document.getElementById('log');
    const logs = [];

    const connectedPeers = new Set();
    const peerDetails = new Map();
    let nodeStarted = false;

    function log(text) {
      logs.push(`[${new Date().toLocaleTimeString()}] ${text}`);
      logEl.textContent = logs.slice(-40).join('\n');
    }

    function postLogger(label, text, level = 'info', state = 'checking') {
      try {
        fetch('/logger', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            time: new Date().toISOString(),
            label,
            text,
            level,
            state,
            source: '/network_time.html',
          }),
        }).catch(() => {});
      } catch {
        // best effort
      }
    }

    function updateDisplay(state) {
      const consensusTime = Date.now() + (state.offsetMs || 0);
      timeDisplay.textContent = new Date(consensusTime).toISOString().replace('T', ' ').replace('Z', ' UTC');
      timeDisplay.className = `time-display-inline status-${state.status}`;
      offsetDisplay.textContent = `${state.offsetMs > 0 ? '+' : ''}${state.offsetMs} ms`;
      sampleDisplay.textContent = String(state.lastSampleCount || 0);
      statusDisplay.textContent = state.status;
      statusDisplay.className = `status status-${state.status}`;
    }

    function updateNodeDisplay() {
      peerIdDisplay.textContent = globalThis.__currentLibp2pPeerId || '—';
      nodeStatusDisplay.textContent = nodeStarted ? 'started' : 'off';
      nodeStatusDisplay.className = `status ${nodeStarted ? 'ok' : ''}`;
      connectedDisplay.textContent = String(connectedPeers.size);
      bootstrapDisplay.textContent = String(DEFAULT_BOOTSTRAP_PEERS.length);
      const listEl = document.getElementById('peerList');
      if (listEl) {
        if (peerDetails.size === 0) {
          listEl.textContent = '';
        } else {
          listEl.innerHTML = Array.from(peerDetails.entries()).map(([id, info]) => {
            const short = id.slice(0, 12) + '…';
            return `<div title="${id}">${short} ${info.addrs ? info.addrs.slice(0, 30) : ''}</div>`;
          }).join('');
        }
      }
    }

    let networkTime = null;
    const headerApi = {
      setNetworkTime({ text, title, state }) {
        const snapshot = networkTime?.getSnapshot?.() || { offsetMs: 0, status: 'checking', lastSampleCount: 0, lastAccuracyMs: null };
        updateDisplay(snapshot);
      },
      logNetworkTime(text) {
        log(text);
      },
    };

    networkTime = initSharedNetworkTime({ headerApi });

    // Restore topic from persisted state into the input field.
    if (topicInput && networkTime?.getSnapshot) {
      const snap = networkTime.getSnapshot();
      if (snap?.topic) topicInput.value = snap.topic;
    }

    function refresh() {
      const state = networkTime.getSnapshot();
      updateDisplay(state);
    }
    refresh();
    setInterval(refresh, 1000);

    syncBtn.addEventListener('click', () => {
      syncBtn.disabled = true;
      log('Manual sync requested…');
      networkTime.syncNow().then(() => {
        refresh();
        syncBtn.disabled = false;
        log('Manual sync complete');
      }).catch((e) => {
        syncBtn.disabled = false;
        log(`Sync failed: ${e.message}`);
      });
    });

    const resetBtn = document.getElementById('resetBtn');
    resetBtn.addEventListener('click', () => {
      log('Resetting network time state…');
      try {
        globalThis.localStorage?.removeItem('nostr-dag.network-time.v2');
      } catch {
        // ignore
      }
      networkTime.resetState();
      refresh();
      log('Network time state reset');
    });

    const topicInput = document.getElementById('topicInput');
    const applyTopicBtn = document.getElementById('applyTopicBtn');
    if (topicInput && applyTopicBtn && networkTime?.setTopic) {
      applyTopicBtn.addEventListener('click', () => {
        const newTopic = topicInput.value.trim();
        if (!newTopic) return;
        log(`Changing topic to "${newTopic}"…`);
        networkTime.setTopic(newTopic).then(() => {
          log(`Topic changed to "${newTopic}"`);
        }).catch((e) => {
          log(`Topic change failed: ${e.message}`);
        });
      });
    }

    async function initLibp2pNode() {
      if (nodeStarted) return;
      startNodeBtn.disabled = true;
      log('Bootstrapping libp2p node…');
      try {
        const { node, bootstrapPeers } = await createSharedLibp2pStack({
          bootstrapPeers: DEFAULT_BOOTSTRAP_PEERS,
          onLog(level, text, state) {
            log(`[libp2p] ${text}`);
          },
          onStatus(state, peerId) {
            log(`[libp2p] ${state} ${peerId}`);
          },
        });

        node.addEventListener('peer:connect', (event) => {
          const peerId = event?.detail?.peerId?.toString?.() || event?.detail?.remotePeer?.toString?.() || 'unknown';
          const addrs = event?.detail?.multiaddrs?.map?.((m) => m.toString()).join(', ') || '';
          connectedPeers.add(peerId);
          peerDetails.set(peerId, { addrs, connectedAt: Date.now() });
          updateNodeDisplay();
          log(`Peer connected: ${peerId}`);
          postLogger('network-time', `Peer connected: ${peerId}`, 'info', 'available');
        });

        node.addEventListener('peer:disconnect', (event) => {
          const peerId = event?.detail?.peerId?.toString?.() || event?.detail?.remotePeer?.toString?.() || 'unknown';
          connectedPeers.delete(peerId);
          peerDetails.delete(peerId);
          updateNodeDisplay();
          log(`Peer disconnected: ${peerId}`);
          postLogger('network-time', `Peer disconnected: ${peerId}`, 'warn', 'checking');
        });

        networkTime.attachNode(node);
        nodeStarted = true;
        updateNodeDisplay();
        log(`Node started: ${node.peerId.toString()}`);
        postLogger('network-time', `Node started: ${node.peerId.toString()}`, 'info', 'available');
        log(`Bootstrap peers: ${bootstrapPeers.length}`);
        postLogger('network-time', `Bootstrap peers: ${bootstrapPeers.length}`, 'debug', 'checking');
      } catch (e) {
        log(`Node bootstrap failed: ${e.message}`);
        startNodeBtn.disabled = false;
      }
    }

    startNodeBtn.addEventListener('click', () => {
      void initLibp2pNode();
    });

    void initLibp2pNode();
  </script>
</body>
</html>
