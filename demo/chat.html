<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat — nostr-dag</title>
  <link rel="icon" href="./shared/favicon.ico" />
  <link rel="stylesheet" href="./shared/page.css" />
  <style>
    html, body {
      height: 100vh;
      margin: 0;
      overflow: hidden;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      padding: 6px 8px;
      line-height: 1.2;
      font-size: 0.8rem;
      display: flex;
      flex-direction: column;
    }
    h1 { font-size: 1rem; margin: 0; display: inline; }
    .subtitle { color: var(--muted); font-size: 0.7rem; display: inline; margin-left: 4px; }
    .wrap {
      max-width: 900px;
      margin: 0 auto;
      width: 100%;
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
      padding-bottom: 10px;
    }
    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 4px;
      flex-shrink: 0;
    }
    .panels {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      flex-shrink: 0;
    }
    /* Override shared .panel for compact chat layout */
    .chat-page .panel {
      border-radius: 4px;
      padding: 6px 8px;
      margin: 0;
    }
    .panel h2 { font-size: 0.8rem; margin: 0 0 3px; }
    .stats {
      font-size: 0.7rem;
      line-height: 1.35;
      display: flex;
      flex-direction: column;
      gap: 1px;
    }
    .stats > span { white-space: nowrap; }
    .status { font-weight: 600; }
    .status.ok { color: var(--status-available); }
    /* Override shared button for compact chat layout */
    .chat-page button {
      padding: 2px 6px;
      font-size: 0.75rem;
      margin-left: 4px;
    }
    button.reset { background: var(--status-unavailable); border-color: var(--status-unavailable); }
    .chat-panel {
      margin-top: 4px;
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
    }
    .chat-input-row {
      display: flex;
      gap: 4px;
      margin-bottom: 4px;
      flex-shrink: 0;
    }
    .chat-input-row input {
      flex: 1;
      font-family: system-ui, sans-serif;
      font-size: 0.8rem;
      padding: 4px 6px;
      border: 1px solid var(--border);
      border-radius: 3px;
      background: var(--bg);
      color: var(--fg);
    }
    /* Collapsible chat log */
    .chat-log {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      border: 1px solid var(--border);
      border-radius: 4px;
      overflow: hidden;
    }
    .chat-log-summary {
      list-style: none;
      cursor: pointer;
      padding: 4px 8px;
      background: var(--panel);
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--fg);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      user-select: none;
    }
    .chat-log-summary::-webkit-details-marker { display: none; }
    .chat-log-summary::after {
      content: '▸';
      color: var(--muted);
      font-size: 0.8rem;
      margin-left: 6px;
    }
    .chat-log[open] .chat-log-summary::after { content: '▾'; color: var(--accent); }
    .chat-log[open] {
      background: var(--panel);
    }
    .chat-messages {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 4px 6px;
      font-size: 0.78rem;
      line-height: 1.35;
    }
    .chat-message {
      margin-bottom: 2px;
      word-break: break-word;
    }
    .chat-message .from {
      font-weight: 600;
      color: var(--accent);
    }
    .chat-message .from.self {
      color: var(--status-available);
    }
    .chat-message .time {
      color: var(--muted);
      font-size: 0.65rem;
    }
    @media (max-width: 640px) {
      body { padding: 8px 12px calc(8px + env(safe-area-inset-bottom)); }
      h1 { font-size: 1.1rem; }
      .panels { grid-template-columns: 1fr; gap: 6px; }
      .chat-page .panel { padding: 10px 12px; }
      .panel h2 { font-size: 0.9rem; }
      .stats { font-size: 0.85rem; }
      /* Larger touch targets for buttons */
      .chat-page button {
        padding: 8px 14px;
        font-size: 0.9rem;
        min-height: 40px;
      }
      .chat-log-summary {
        padding: 8px 10px;
        font-size: 0.9rem;
      }
      .chat-messages {
        padding: 8px 10px;
        font-size: 0.9rem;
      }
      .chat-message { margin-bottom: 4px; }
      .chat-message .time { font-size: 0.72rem; }
      .chat-input-row {
        gap: 8px;
        margin-bottom: 8px;
      }
      .chat-input-row input {
        padding: 8px 10px;
        font-size: 1rem; /* prevent iOS zoom on focus */
        min-height: 40px;
      }
    }
  </style>
</head>
<body class="chat-page">
  <div class="wrap">
    <div class="header-row">
      <div>
        <h1>P2P Chat</h1>
        <span class="subtitle">libp2p gossipsub</span>
      </div>
      <a href="./index.html" style="text-decoration:none;font-size:1.1rem;">⬅</a>
    </div>

    <div class="panels">
      <div class="panel">
        <h2>Node</h2>
        <div class="stats">
          <span><span class="muted">Peer ID:</span> <span id="peerIdDisplay" class="mono">—</span></span>
          <span><span class="muted">Status:</span> <span id="nodeStatusDisplay" class="status status-idle"><span class="status-dot"></span><span class="status-label">off</span></span></span>
          <span><span class="muted">Connected:</span> <span id="connectedDisplay">0</span></span>
          <button id="startNodeBtn" type="button">Start</button>
          <button id="resetNodeBtn" type="button" class="reset">Reset</button>
        </div>
      </div>

      <div class="panel">
        <h2>Chat</h2>
        <div class="stats">
          <span><span class="muted">Messages:</span> <span id="messageCount">0</span></span>
          <span><span class="muted">Topic:</span> <span class="mono">nostr-dag-bridge</span></span>
        </div>
      </div>
    </div>

    <div class="chat-panel">
      <div class="chat-input-row">
        <input id="chatInput" type="text" placeholder="Type a message and press Enter…" disabled />
        <button id="sendBtn" type="button" disabled>Send</button>
      </div>
      <details class="chat-log" id="chatLog">
        <summary class="chat-log-summary">Messages <span id="messageCountBadge" class="pill">0</span></summary>
        <div id="chatMessages" class="chat-messages">
          <div class="muted">Start the node to join the chat…</div>
        </div>
      </details>
    </div>
  </div>

  <script type="module">
    import { createSharedLibp2pStack, DEFAULT_BOOTSTRAP_PEERS } from './shared/libp2p-stack.mjs';
    import { attachChatNode, sendChat, sendChatJoin, sendChatPing, resetChat, onMessage, onPeer, onPing } from './shared/chat.mjs';
    import { multiaddr } from 'https://esm.sh/@multiformats/multiaddr';

    const wasmModuleUrl = new URL('./pkg/nostr_dag.js', window.location.href).href;
    const wasmBinaryUrl = new URL('./pkg/nostr_dag_bg.wasm', window.location.href).href;

    const peerIdDisplay = document.getElementById('peerIdDisplay');
    const nodeStatusDisplay = document.getElementById('nodeStatusDisplay');
    const connectedDisplay = document.getElementById('connectedDisplay');
    const startNodeBtn = document.getElementById('startNodeBtn');
    const messageCount = document.getElementById('messageCount');
    const messageCountBadge = document.getElementById('messageCountBadge');
    const chatMessages = document.getElementById('chatMessages');
    const chatLog = document.getElementById('chatLog');
    const chatInput = document.getElementById('chatInput');
    const sendBtn = document.getElementById('sendBtn');

    const connectedPeers = new Set();
    let nodeStarted = false;
    let wasmModule = null;
    let libp2pNode = null;
    let userScrolledUp = false;

    function isNearBottom(container, threshold = 60) {
      return container.scrollHeight - container.scrollTop - container.clientHeight <= threshold;
    }

    chatMessages.addEventListener('scroll', () => {
      userScrolledUp = !isNearBottom(chatMessages);
    }, { passive: true });

    function appendMessage(entry) {
      const wasNearBottom = isNearBottom(chatMessages);
      const div = document.createElement('div');
      div.className = 'chat-message';
      const shortFrom = entry.from.slice(0, 16) + (entry.from.length > 16 ? '…' : '');
      const time = new Date(entry.timestamp).toLocaleTimeString();
      const selfClass = entry.self ? 'self' : '';
      div.innerHTML = `<span class="time">[${time}]</span> <span class="from ${selfClass}">${escapeHtml(shortFrom)}</span>: ${escapeHtml(entry.text)}`;
      chatMessages.appendChild(div);
      // Only auto-scroll if the user was already near the bottom.
      if (wasNearBottom) {
        chatMessages.scrollTop = chatMessages.scrollHeight;
      }
      const count = chatMessages.children.length;
      messageCount.textContent = String(count);
      if (messageCountBadge) messageCountBadge.textContent = String(count);
      // Auto-open the log when a new message arrives so the user sees it.
      if (chatLog && !chatLog.open) chatLog.open = true;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    onMessage((entry) => {
      appendMessage(entry);
    });

    onPeer((event) => {
      if (event.kind === 'joined') {
        appendMessage({ from: 'system', text: `Peer joined: ${event.peer.slice(0, 16)}${event.peer.length > 16 ? '…' : ''}`, timestamp: event.timestamp });
      } else if (event.kind === 'left') {
        appendMessage({ from: 'system', text: `Peer left: ${event.peer.slice(0, 16)}${event.peer.length > 16 ? '…' : ''}`, timestamp: event.timestamp });
      } else if (event.kind === 'ping') {
        appendMessage({ from: 'system', text: `Ping from ${event.peer.slice(0, 16)}${event.peer.length > 16 ? '…' : ''}`, timestamp: event.timestamp });
      }
    });

    onPing((result) => {
      appendMessage({ from: 'system', text: `⏱ RTT ${result.rtt}ms (${result.peer.slice(0, 16)}${result.peer.length > 16 ? '…' : ''})`, timestamp: Date.now() });
    });

    async function loadWasm() {
      try {
        const pkg = await import(wasmModuleUrl);
        if (typeof pkg.default === 'function') {
          await pkg.default({ module_or_path: wasmBinaryUrl });
        }
        wasmModule = pkg;
        appendMessage({ from: 'system', text: 'WASM module loaded', timestamp: Date.now() });
      } catch (e) {
        appendMessage({ from: 'system', text: `WASM load skipped: ${e.message}`, timestamp: Date.now() });
      }
    }

    async function initLibp2pNode() {
      if (nodeStarted) return;
      startNodeBtn.disabled = true;
      try {
        const { node, bootstrapPeers } = await createSharedLibp2pStack({
          bootstrapPeers: DEFAULT_BOOTSTRAP_PEERS,
          wasmModule,
          onLog(level, text) {
            // Log libp2p events to chat stream for diagnostics
            if (level === 'error' || level === 'warn' || text.includes('dial') || text.includes('connected') || text.includes('started')) {
              appendMessage({ from: 'system', text: `[p2p ${level}] ${text}`, timestamp: Date.now() });
            }
          },
        });

        // Explicitly dial local native peers so the browser joins the gossipsub mesh
        // immediately instead of waiting for bootstrap interval (60s).
        try {
          const res = await fetch('/peers', { cache: 'no-store' });
          if (res.ok) {
            const peers = await res.json();
            for (const peer of peers) {
              if (peer.kind !== 'native' || peer.source !== 'localhost') continue;
              const m = (peer.detail || '').match(/addrs=([^\n]+)/);
              const addrs = m ? m[1].split(',').map(s => s.trim()).filter(Boolean) : [];
              for (const addr of addrs) {
                if (!addr.includes('/ws') && !addr.includes('/wss')) continue;
                const full = addr.includes(`/p2p/${peer.peer_id}`) ? addr : `${addr}/p2p/${peer.peer_id}`;
                try {
                  await node.dial(multiaddr(full));
                  appendMessage({ from: 'system', text: `Dialed native peer ${full.slice(0, 50)}…`, timestamp: Date.now() });
                } catch (dialErr) {
                  appendMessage({ from: 'system', text: `Dial failed: ${dialErr.message || dialErr}`, timestamp: Date.now() });
                }
              }
            }
          }
        } catch (fetchErr) {
          appendMessage({ from: 'system', text: `Fetch peers failed: ${fetchErr.message}`, timestamp: Date.now() });
        }

        node.addEventListener('peer:connect', (event) => {
          const peerId = event?.detail?.peerId?.toString?.() || event?.detail?.remotePeer?.toString?.() || 'unknown';
          const isNew = !connectedPeers.has(peerId);
          connectedPeers.add(peerId);
          connectedDisplay.textContent = String(connectedPeers.size);
          if (isNew) {
            appendMessage({ from: 'system', text: `Peer joined: ${peerId.slice(0, 16)}${peerId.length > 16 ? '…' : ''}`, timestamp: Date.now() });
          }
        });

        node.addEventListener('peer:disconnect', (event) => {
          const peerId = event?.detail?.peerId?.toString?.() || event?.detail?.remotePeer?.toString?.() || 'unknown';
          const hadPeer = connectedPeers.has(peerId);
          connectedPeers.delete(peerId);
          connectedDisplay.textContent = String(connectedPeers.size);
          if (hadPeer) {
            appendMessage({ from: 'system', text: `Peer left: ${peerId.slice(0, 16)}${peerId.length > 16 ? '…' : ''}`, timestamp: Date.now() });
          }
        });

        libp2pNode = node;
        await attachChatNode(node);
        nodeStarted = true;
        peerIdDisplay.textContent = node.peerId.toString();
        nodeStatusDisplay.className = 'status status-available';
        nodeStatusDisplay.querySelector('.status-label').textContent = 'started';
        chatInput.disabled = false;
        sendBtn.disabled = false;
        // Replace placeholder instead of wiping history (dial logs already appended)
        if (chatMessages.children.length === 1 && chatMessages.children[0].classList.contains('muted')) {
          chatMessages.innerHTML = '';
        }
        appendMessage({ from: 'system', text: 'Node started. Bootstrap peers: ' + bootstrapPeers.length, timestamp: Date.now() });

        // Broadcast join event so other peers see us enter the chat
        try {
          await sendChatJoin();
        } catch {
          // best-effort
        }
      } catch (e) {
        startNodeBtn.disabled = false;
        appendMessage({ from: 'system', text: 'Node failed: ' + e.message, timestamp: Date.now() });
      }
    }

    startNodeBtn.addEventListener('click', () => {
      void initLibp2pNode();
    });

    document.getElementById('resetNodeBtn').addEventListener('click', async () => {
      appendMessage({ from: 'system', text: 'Resetting…', timestamp: Date.now() });
      if (libp2pNode?.stop) {
        try { await libp2pNode.stop(); } catch {}
      }
      resetChat();
      // Clear UI immediately so the user sees feedback even if reload is delayed.
      chatMessages.innerHTML = '<div class="muted">Start the node to join the chat…</div>';
      messageCount.textContent = '0';
      if (messageCountBadge) messageCountBadge.textContent = '0';
      if (chatLog) chatLog.open = false;
      peerIdDisplay.textContent = '—';
      nodeStatusDisplay.className = 'status status-idle';
      nodeStatusDisplay.querySelector('.status-label').textContent = 'off';
      connectedDisplay.textContent = '0';
      chatInput.disabled = true;
      sendBtn.disabled = true;
      nodeStarted = false;
      libp2pNode = null;
      connectedPeers.clear();
      // Force a full reload so every singleton (WASM, global state, peer id) is reborn.
      window.location.reload();
    });

    // Safari back-forward cache can restore the old DOM; hard-reset when that happens.
    window.addEventListener('pageshow', (event) => {
      if (event.persisted) {
        chatMessages.innerHTML = '<div class="muted">Start the node to join the chat…</div>';
        messageCount.textContent = '0';
        if (messageCountBadge) messageCountBadge.textContent = '0';
        if (chatLog) chatLog.open = false;
        peerIdDisplay.textContent = '—';
        nodeStatusDisplay.className = 'status status-idle';
        nodeStatusDisplay.querySelector('.status-label').textContent = 'off';
        connectedDisplay.textContent = '0';
        chatInput.disabled = true;
        sendBtn.disabled = true;
        nodeStarted = false;
        libp2pNode = null;
        connectedPeers.clear();
      }
    });

    async function doSend() {
      const text = chatInput.value.trim();
      chatInput.value = '';
      if (!text) {
        try {
          await sendChatPing();
        } catch (e) {
          appendMessage({ from: 'system', text: 'Ping failed: ' + e.message, timestamp: Date.now() });
        }
        return;
      }
      try {
        await sendChat(text);
      } catch (e) {
        appendMessage({ from: 'system', text: 'Send failed: ' + e.message, timestamp: Date.now() });
      }
    }

    sendBtn.addEventListener('click', doSend);
    chatInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        doSend();
      }
    });

    void (async () => {
      await loadWasm();
      await initLibp2pNode();
    })();
  </script>
</body>
</html>
