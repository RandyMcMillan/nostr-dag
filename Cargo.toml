[package]
name = "nostr-dag"
version = "0.18.1"
edition = "2021"
repository = "https://github.com/RandyMcMillan/nostr-dag"
license = "MIT"
description = "DAG-based optimistic consensus for Nostr"
build = "build.rs"
default-run = "nostr-dag-server"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "federation"
path = "src/bin/federation.rs"
required-features = ["native"]

[[bin]]
name = "keygen"
path = "src/bin/keygen.rs"
required-features = ["native"]

[[bin]]
name = "relay"
path = "src/bin/relay.rs"
required-features = ["relay"]

[[bin]]
name = "nostr-dag-server"
path = "src/bin/nostr-dag-server.rs"
required-features = ["native"]

[[bin]]
name = "git-info"
path = "src/bin/git-info.rs"
required-features = ["native"]

[[bin]]
name = "p2p-node"
path = "src/bin/p2p-node.rs"
required-features = ["p2p"]

[features]
default = []
native = [
    "dep:tokio",
    "dep:tracing-subscriber",
    "dep:nostr-relay-pool",
    "dep:serde",
    "dep:serde_json",
    "dep:reqwest",
    "dep:urlencoding",
    "dep:rusqlite",
    "dep:git2",
]
relay = ["native", "dep:nostr-relay-builder"]
wasm = [
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:web-sys",
    "dep:getrandom",
    "dep:getrandom_0_3",
    "dep:serde",
    "dep:serde-wasm-bindgen",
    "dep:serde_json",
]
p2p = ["native", "dep:libp2p", "dep:libp2p-webrtc", "dep:rcgen"]
p2p-wasm = ["wasm", "dep:libp2p", "dep:futures", "dep:js-sys"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
libp2p = { version = "0.54", optional = true, features = [
    "tcp",
    "noise",
    "yamux",
    "relay",
    "dcutr",
    "autonat",
    "mdns",
    "gossipsub",
    "identify",
    "dns",
    "websocket",
    "ping",
    "tokio",
    "macros",
    "rsa",
] }
libp2p-webrtc = { version = "0.8.0-alpha", features = ["tokio", "pem"], optional = true }
nostr = { version = "0.44", default-features = false, features = ["std"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
futures = { version = "0.3", optional = true }
libp2p = { version = "0.54", optional = true, features = [
    "wasm-bindgen",
    "websocket-websys",
    "noise",
    "yamux",
    "gossipsub",
    "identify",
    "ping",
    "macros",
] }
nostr = { version = "0.44", default-features = false, features = ["std"] }

[dependencies]
getrandom = { version = "0.2", features = ["js"], optional = true }
getrandom_0_3 = { package = "getrandom", version = "0.3", features = ["wasm_js"], optional = true }
git2 = { version = "0.20", optional = true }
js-sys = { version = "0.3", optional = true }
nostr-relay-pool = { version = "0.44.3", optional = true }
rand = "0.8"
rcgen = { version = "0.11", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
rusqlite = { version = "0.40.2", features = ["bundled"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }
serde_json = { version = "1", optional = true }
sha2 = "0.10"
thiserror = "1.0"
tokio = { version = "1", features = ["full"], optional = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
urlencoding = { version = "2", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
web-sys = { version = "0.3", optional = true, features = ["Request", "RequestInit", "RequestMode", "Response", "Window", "console"] }

[dependencies.nostr-relay-builder]
version = "0.44.0"
optional = true

[dev-dependencies]
nostr-relay-builder = "0.44.0"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
